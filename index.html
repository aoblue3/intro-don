<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>INTRO DON! - Deluxe Edition</title>
    <style>
        :root { --primary-color: #007bff; --admin-color: #ff4757; --bg-color: #0f0f0f; --gold: #ffd700; --my-name-color: #00d4ff; --success-green: #28a745; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; background: var(--bg-color); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* セットアップ画面 */
        #setup-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .setup-box { background: #fff; color: #333; padding: 40px; border-radius: 20px; text-align: center; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-join { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .admin-login-link { cursor: pointer; color: #666; font-size: 13px; margin-top: 15px; text-decoration: underline; display: block; }

        /* 管理パネル */
        #admin-panel { background: #000; padding: 12px; display: none; border-bottom: 2px solid var(--admin-color); z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .admin-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .admin-btn { background: var(--admin-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        #reserve-area { flex: 1; height: 50px; background: #222; color: #0f0; border: 1px solid #444; border-radius: 4px; font-family: monospace; font-size: 11px; padding: 5px; }
        #admin-seekbar { flex: 1; min-width: 150px; cursor: pointer; }

        /* 問題追加モーダル */
        #q-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10001; align-items: center; justify-content: center; }
        .q-modal-box { background: #222; padding: 25px; border-radius: 15px; width: 400px; border: 1px solid var(--admin-color); }
        .q-modal-box h3 { margin-top: 0; color: var(--admin-color); }
        .q-input-group { margin-bottom: 15px; }
        .q-input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .q-input-group input, .q-input-group select { width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .q-modal-btns { display: flex; gap: 10px; margin-top: 20px; }

        /* メインレイアウト */
        #main-game { display: none; flex: 1; overflow: hidden; }
        #video-section { flex: 7; position: relative; background: #000; display: flex; flex-direction: column; }
        
        #player-wrapper { flex: 1; position: relative; background: #000; overflow: hidden; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #click-guard { position: absolute; inset: 0; z-index: 15; background: transparent; }
        #video-cover { position: absolute; inset: 0; background: radial-gradient(circle, #222 0%, #000 100%); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* 問題文表示エリア */
        #quiz-question-display {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 15px 30px; border-radius: 10px;
            border-left: 5px solid var(--primary-color); font-size: 1.8rem; font-weight: bold;
            color: #fff; z-index: 70; display: none; text-shadow: 2px 2px 4px #000;
            max-width: 70%; text-align: center;
        }

        /* クイズ専用15秒カウントダウン */
        #quiz-timer-display {
            position: absolute; bottom: 80px; right: 20px;
            background: rgba(255, 71, 87, 0.9); padding: 15px 20px; border-radius: 10px;
            font-size: 1.8rem; font-weight: bold; color: #fff; z-index: 51; display: none;
            min-width: 80px; text-align: center; box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        /* クイズ専用開始カウントダウン */
        #quiz-start-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 60; display: none; align-items: center; justify-content: center;
            font-size: 12rem; font-weight: bold; color: var(--gold); text-shadow: 0 0 30px var(--gold);
        }

        /* クイズタイトル隠し用オーバーレイ */
        #quiz-title-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000;
            z-index: 42;
            display: none;
        }

        /* モザイククイズ用 */
        #mosaic-overlay {
            position: absolute; inset: 0; z-index: 39; display: none;
            backdrop-filter: blur(50px); pointer-events: none;
        }

        /* カウントダウン表示 */
        #countdown-container { display: none; position: relative; width: 250px; height: 250px; align-items: center; justify-content: center; }
        #countdown-circle { position: absolute; inset: 0; border: 6px solid rgba(255, 255, 255, 0.2); border-radius: 50%; }
        
        #countdown-line {
            position: absolute;
            inset: -3px;
            border: 6px solid transparent;
            border-top: 6px solid #fff;
            border-radius: 50%;
            z-index: 10;
        }

        #countdown-display { font-size: 10rem; font-weight: bold; color: #fff; z-index: 5; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #play-sec-preview { color: #fff; font-weight: bold; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* コメント関連 */
        #screen-chat-overlay { position: absolute; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
        .danmaku { position: absolute; white-space: nowrap; font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000; left: 100%; animation: scrollLeft 4s linear forwards; }
        @keyframes scrollLeft { from { left: 100%; } to { left: -150%; } }
        
        #fastest-ranking { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 500px; display: none; z-index: 100; 
            border: 2px solid var(--gold); background: rgba(0,0,0,0.95); 
            border-radius: 15px; padding: 20px; box-shadow: 0 0 50px rgba(255,215,0,0.3); 
        }

        .rank-item { opacity: 0; transform: translateY(20px); transition: all 0.4s ease; display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; font-size: 1.2rem; }
        .rank-item.show { opacity: 1; transform: translateY(0); }
        .rank-item.is-1st { color: var(--gold); font-weight: bold; font-size: 1.5rem; border-bottom: 2px solid var(--gold); }

        @keyframes winner-pulse { 0% { box-shadow: 0 0 10px var(--gold); } 50% { box-shadow: 0 0 40px var(--gold); } 100% { box-shadow: 0 0 10px var(--gold); } }
        .winner-anim { animation: winner-pulse 1s infinite; }
        #sidebar { flex: 2; background: #1a1a1a; border-left: 1px solid #333; display: flex; flex-direction: column; min-width: 250px; }
        #user-list { flex: 1; padding: 10px; overflow-y: auto; }
        .user-card { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
        .user-card.is-me { border: 2px solid var(--my-name-color); background: #1a3a4a; }
        .user-card.is-admin { border: 2px solid var(--admin-color); background: #3a1a1a; }
        
        .crown { color: var(--gold); margin-right: 4px; }
        .correct-mark { background: var(--success-green); color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }

        #input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; border-top: 1px solid #333; align-items: center; z-index: 70; position: relative; }
        #answer-input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 2px solid #444; background: #333; color: #fff; outline: none; }
        #result-notice { position: absolute; top: -30px; left: 20px; font-weight: bold; display: none; z-index: 80; }
        
        .volume-controls { display: flex; align-items: center; gap: 8px; min-width: 140px; }
        #volume-slider { accent-color: var(--primary-color); width: 80px; cursor: pointer; }

        /* 管理者以外にはエラーメッセージを非表示 */
        body:not(.is-admin-mode) #error-message { display: none !important; }
        /* 選択肢ボタンの見た目 */
        /* 1. ボタンを包むコンテナ（2列に並べるための親） */
        #choice-container {
            display: flex;
            flex-wrap: wrap;      /* 折り返しを許可 */
            gap: 10px;            /* ボタン同士の隙間 */
            justify-content: center;
            width: 100%;
            max-width: 600px;     /* お好みの横幅に調整してください */
            margin: 15px auto;    /* 中央寄せ */
        }

        /* 2. 選択肢ボタン本体 */
        .choice-btn {
            /* --- 横並びの設定 --- */
            flex: 1 1 calc(50% - 10px); /* 幅を半分（50%）に設定。隙間分を引く */
            box-sizing: border-box;
    
            /* --- 見た目の設定（あなたのコードをベースにしています） --- */
            padding: 15px 10px; /* 上下15px, 左右10px */
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid var(--primary-color, #fff);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 1px 1px 2px black;
        }

        .choice-btn:hover:not(:disabled) {
            background: var(--primary-color, #444);
            transform: scale(1.02);
        }

        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
}
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="setup-box">
        <h2 style="margin:0 0 20px 0;">INTRO DON! Deluxe Edition</h2>
        <input type="text" id="user-name" placeholder="名前を入力" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
        <button id="btn-join-player" class="btn-join" style="display: none;">参加する</button>
        <div id="closed-message" style="color: red; font-size: 14px; font-weight: bold; margin: 10px 0;"></div>
        <button id="admin-close-lock" style="display: block; width: 100%; margin-bottom: 10px; opacity: 0.5; font-size: 10px; border: none; background: none; cursor: pointer;">[管理設定: 部屋の開放/閉鎖]</button>
        <span id="btn-admin-login" class="admin-login-link">🔧 主催者ログイン</span>
    </div>
</div>

<div id="admin-panel">
    <div class="admin-row">
        <span id="admin-round-text" style="color:var(--gold); font-weight:bold; margin-right:10px;">Round: 0</span>
        <button class="admin-btn" id="btn-play-1">1s</button>
        <button class="admin-btn" id="btn-play-1-5">1.5s</button>
        <button class="admin-btn" id="btn-play-2">2s</button>
        <button class="admin-btn" id="btn-play-2-5">2.5s</button>
        <button class="admin-btn" id="btn-play-3">3s</button>
        <button class="admin-btn" id="btn-play-5">5s</button>
        <button class="admin-btn" id="btn-play-10">10s</button>
        ｜ <button class="admin-btn" id="btn-reveal" style="background:#28a745">答え表示</button>
        <button id="btn-pause" class="admin-btn" style="background:#ff9800;">動画を一時停止</button>
        ｜ <button class="admin-btn" id="btn-toggle-rank" style="background:var(--gold); color:#000;">早解き表示</button>
        <button class="admin-btn" id="btn-video-on" style="background:#007bff">画面ON</button>
        <button class="admin-btn" id="btn-video-off" style="background:#666">画面OFF</button>
        ｜ <button class="admin-btn" id="btn-open-q-modal" style="background:#555">問題追加</button>
        ｜<button id="admin-kick-all" style="background:#ff4444; color:white; border:none; border-radius:5px; padding:5px 10px; cursor:pointer; margin-left:10px;">全員退出</button>
         <button class="admin-btn" id="btn-reset-all" style="background:#444">全リセット</button>
        ｜ <input type="range" id="admin-seekbar" min="0" max="100" value="0">
        <span id="admin-time-display" style="color:#0f0; font-size:12px; font-family:monospace; min-width:35px;">0:00</span>
    </div>
    <div class="admin-row">
        <textarea id="reserve-area" placeholder="URL 曲名 アーティスト (クイズは URL !!問題 答え)"></textarea>
        <!-- 通常の次の曲へ：元の関数をonclickで直接呼び出し、通常モード(false)で実行します -->
        <button class="admin-btn" id="btn-next-quiz" onclick="loadNextFromReserve(false)" style="background:var(--primary-color); height:50px;">次の曲へ</button>
        <!-- ランダム次の曲へ：新しく作った関数をonclickで直接呼び出し、ランダムモードを実行します -->
        <button class="admin-btn" id="btn-random-quiz" onclick="loadRandomFromReserve()" style="background:#6c757d; height:50px; margin-left:5px;">ランダム次の曲へ</button>
        <span id="admin-answer-preview" style="color:#0f0; font-size:12px; margin-left:10px;"></span>
    </div>
</div>

<!-- 問題追加モーダル -->
<div id="q-modal">
    <div class="q-modal-box">
        <h3>問題を追加</h3>
        <div class="q-input-group">
            <label>形式</label>
            <select id="mq-type">
                <option value="normal">イントロ (URL*曲名*アーティスト)</option>
                <option value="quiz">クイズ (URL*!!問題*答え)</option>
                <option value="mosaic">モザイク (URL*""問題*答え)</option>
                <!-- ★新モード2つを、指定の記号形式（$! / $"）の注釈付きで追加 -->
                <option value="choice_quiz">選択肢クイズ (URL*$!問題*正解*誤答1*誤答2*誤答3)</option>
                <option value="choice_mosaic">選択肢モザイク (URL*$"問題*正解*誤答1*誤答2*誤答3)</option>
            </select>
        </div>
        <div class="q-input-group">
            <label>YouTube URL / ID</label>
            <input type="text" id="mq-url" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        <div id="mq-normal-inputs">
            <div class="q-input-group">
                <label>曲名 / 答え</label>
                <input type="text" id="mq-title" placeholder="曲名 または クイズの答え">
            </div>
            <div class="q-input-group" id="mq-artist-group">
                <label>アーティスト名</label>
                <input type="text" id="mq-artist" placeholder="アーティスト名">
            </div>
        </div>
        <div id="mq-quiz-inputs" style="display:none;">
            <div class="q-input-group">
                <label>問題文</label>
                <input type="text" id="mq-question" placeholder="画面に表示する問題文">
            </div>
        </div>

        <!-- ★新設：選択肢モード（choice_quiz / choice_mosaic）の時だけJavaScript側で表示切り替えするエリア -->
        <div id="mq-choice-inputs" style="display:none;">
            <div class="q-input-group">
                <label>選択肢1（★必ずここに「正解」を入力）</label>
                <input type="text" id="mq-choice1" placeholder="正解の選択肢（※自動でシャッフルされます）">
            </div>
            <div class="q-input-group">
                <label>選択肢2（誤答）</label>
                <input type="text" id="mq-choice2" placeholder="間違いの選択肢1">
            </div>
            <div class="q-input-group">
                <label>選択肢3（誤答）</label>
                <input type="text" id="mq-choice3" placeholder="間違いの選択肢2">
            </div>
            <div class="q-input-group">
                <label>選択肢4（誤答）</label>
                <input type="text" id="mq-choice4" placeholder="間違いの選択肢3">
            </div>
        </div>

        <div class="q-input-group">
            <label>音量倍率 (0.1〜2.0 / 通常は1)</label>
            <input type="number" id="mq-vol" value="1.0" step="0.1">
        </div>
        <div class="q-modal-btns">
            <button class="admin-btn" id="btn-mq-add" style="flex:1; background:var(--primary-color);">リストに追加</button>
            <button class="admin-btn" id="btn-mq-close" style="flex:1; background:#666;">キャンセル</button>
        </div>
    </div>
</div>

<div id="main-game">
    <div id="video-section">
        <div id="screen-chat-overlay"></div>
        <div id="quiz-title-mask"></div>
        <div id="mosaic-overlay"></div>
        <div id="quiz-question-display"></div>
        <!-- 選択肢クイズ用エリア：下方向にスライドさせて問題文に接近 -->
        <div id="choice-container" style="display: none; flex-wrap: wrap; gap: 10px; width: 100%; max-width: 500px; position: absolute; top: 60%; left: 50%; transform: translate(-50%, 40px); z-index: 100; justify-content: center;">            <button class="choice-btn" onclick="selectChoice(0)" style="width: calc(50% - 10px); flex: 0 0 auto; box-sizing: border-box;"></button>
            <button class="choice-btn" onclick="selectChoice(1)" style="width: calc(50% - 10px); flex: 0 0 auto; box-sizing: border-box;"></button>
            <button class="choice-btn" onclick="selectChoice(2)" style="width: calc(50% - 10px); flex: 0 0 auto; box-sizing: border-box;"></button>
            <button class="choice-btn" onclick="selectChoice(3)" style="width: calc(50% - 10px); flex: 0 0 auto; box-sizing: border-box;"></button>
        </div>
        <!-- ここまで -->
        <div id="quiz-timer-display">15</div>
        <div id="quiz-start-overlay"></div>
        <div id="fastest-ranking">
            <div style="text-align:center; color:var(--gold); font-weight:bold; border-bottom:2px solid var(--gold); padding-bottom:5px; margin-bottom:10px;">FASTEST CORRECT ANSWERS</div>
            <div id="rank-list"></div>
        </div>        
        <div id="player-wrapper">
            <div id="click-guard"></div>
            <div id="video-cover">
                <div id="round-text" style="color:var(--primary-color); font-weight:bold; font-size: 1.2rem; margin-bottom: 10px;">ROUND 0</div>
                <div id="play-sec-preview" style="display: none;">再生時間: 0秒</div>
                <div id="error-message" style="display:none; color:#ff4757; font-weight:bold; font-size:1.5rem; margin-bottom:10px;">動画が読み込めません</div>
                <div id="countdown-container">
                    <div id="countdown-circle"></div>
                    <div id="countdown-line"></div>
                    <div id="countdown-display"></div>
                </div>
                <div id="ready-text" style="font-size:2.5rem; font-weight:bold; letter-spacing:5px;">READY?</div>
            </div>
            <div id="player"></div>
        </div>

        <div id="input-area">
            <div id="result-notice"></div>
            <input type="text" id="answer-input" placeholder="答えを入力！">
            <button id="btn-send-answer" style="background:var(--primary-color); color:white; border:none; border-radius:25px; padding:10px 25px; cursor:pointer;">送信</button>
            <button id="fullscreen-btn" style="background:#555; color:white; border:none; border-radius:25px; padding:10px 15px; cursor:pointer; margin: 0 5px;">全画面</button>
            <button id="pass-btn" onclick="sendPassSignal()" style="background:#888; color:white; border:none; border-radius:25px; padding:10px 15px; cursor:pointer; margin: 0 5px;">パス</button>
            <div class="volume-controls">
                <span id="mute-btn" style="cursor:pointer;">🔈</span>
                <input type="range" id="volume-slider" min="0" max="100" value="50">
                <span id="volume-val" style="font-size:12px; min-width:20px;">50</span>
            </div>
        </div>
    </div>
    
    <div id="sidebar">
        <div style="padding:15px; font-size:11px; color:#aaa; display:flex; justify-content:space-between;">
            <span>RANKING</span>
            <span id="player-count">0 ONLINE</span>
        </div>
        <div id="user-list"></div>
        <div id="ban-list-display" style="padding:0 15px 15px 15px; font-size:10px; color:#ff4d4d;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update, increment, query, limitToLast, onDisconnect, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAWAEgirPeXoqn6b9YATepoudYfN9NGWB8",
        authDomain: "intro-don-game.firebaseapp.com",
        databaseURL: "https://intro-don-game-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "intro-don-game",
        storageBucket: "intro-don-game.firebasestorage.app",
        messagingSenderId: "398946245708",
        appId: "1:398946245708:web:97cf5bf7b601765c3d68e9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let player, myName = "", myId = "", isAdmin = false;
    let quizInfo = { title: "", artist: "", round: 0, isQuizMode: false, isMosaicMode: false, questionText: "", startTimeOffset: 0, volumeRatio: 1.0 };
    let hasPointedTitle = false, hasPointedArtist = false, isRevealedGlobal = false;
    let roundPointsEarned = 0;
    let lastVolume = 50, isMuted = false, currentRankingVisible = false;
    let lastVideoId = ""; 
    let isFirstPlayOfRound = true;

    const prepareJoin = async (role) => {
        try {
            const input = document.getElementById('user-name');
            let rawInput = input.value.trim();
            // HTMLやスクリプト記号を完全に無効化します
            let baseName = rawInput
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            if(!baseName) return alert("名前を入力してください");
            if(role === 'admin') { myId = "admin_master"; myName = baseName; } 
            else {
                myId = localStorage.getItem('intro_don_uid') || 'u_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('intro_don_uid', myId);
                const usersSnap = await get(ref(db, 'game/users'));
                let finalName = baseName;
                if(usersSnap.exists()){
                    const users = usersSnap.val();
                    let count = 0;
                    Object.values(users).forEach(u => { if(u && u.id !== myId && (u.name === baseName || (u.name && u.name.startsWith(baseName + "#")))) count++; });
                    if(count > 0) finalName = `${baseName}#${count}`;
                }
                myName = finalName;
            }
            await joinGame(role);
        } catch (e) { alert("ログインエラー"); }
    };

    async function joinGame(role) {
        isAdmin = (role === 'admin');
        if(isAdmin) document.body.classList.add('is-admin-mode');
// 【ここから追加】
        let savedId = localStorage.getItem('quiz_user_id');
        if (!savedId) {
            localStorage.setItem('quiz_user_id', myId);
        } else {
            myId = savedId;
        }

        const userRef = ref(db, `game/users/${myId}`);
        const snap = await get(userRef);
        const userData = snap.val();

        if (!userData || userData.score === undefined) {
            // 新規ユーザー：スコア0で作成
            await set(userRef, { 
                id: myId, 
                name: myName, 
                isAdmin, 
                score: 0, 
                joinedAt: serverTimestamp(), 
                lastSeen: serverTimestamp(), 
                isOnline: true 
            });
        } else {
            // 既存ユーザー：スコアを触らず名前と状態だけ更新
            await update(userRef, { 
                name: myName, 
                isAdmin, 
                lastSeen: serverTimestamp(), 
                isOnline: true 
            });
        }
        // 【ここまで追加・修正】
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-game').style.display = 'flex';
        if(isAdmin) document.getElementById('admin-panel').style.display = 'block';
        onDisconnect(userRef).update({ isOnline: false, lastSeen: serverTimestamp() });
        setInterval(() => { if(myId) update(ref(db, `game/users/${myId}`), { lastSeen: serverTimestamp(), isOnline: true }); }, 30000);
        initYouTube();
    }

// --- YouTube API 初期化 (Firefox安定版) ---
function initYouTube() {
    // 既存のスクリプトがあるかチェック
    const existingTag = document.querySelector('script[src*="iframe_api"]');
    if (!existingTag) {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api"; // 元に戻す
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } else if (window.YT && window.YT.Player) {
        onYouTubeIframeAPIReady();
    }
}

window.onYouTubeIframeAPIReady = () => {
        if (player) return;

        // 過去の成功例に基づいた、厳密なorigin生成
        let origin = window.location.protocol + '//' + window.location.hostname;
        if (window.location.port) origin += ':' + window.location.port;

        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: 'dQw4w9WgXcQ', // 初期動画ID
            host: 'https://www.youtube.com', // 成功例と同じ標準ドメイン
            playerVars: { 
                'controls': 0,
                'disablekb': 1,
                'rel': 0,
                'autoplay': 1,
                'mute': 1,
                'origin': origin,
                'enablejsapi': 1,
                'widget_referrer': origin,
                'playsinline': 1,
                // 不要なパラメータ（iv_load_policy等）を一切排除し、
                // Firefoxのトラッキング防止に引っかからない「最小構成」にする
            },
            events: { 
                'onReady': (event) => {
                    // --- 属性の追加 ---
                    const iframe = event.target.getIframe();
                    if (iframe) {
                        // ブラウザに自動再生と暗号化メディアの許可を明示的に伝える
                        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
                    }
                    // --- 既存の処理 ---
                    if (typeof listenToSignals === 'function') listenToSignals();
                },
                'onStateChange': (e) => {
                    // ★新設：このユーザーが画面でミュート中なら、動画の状態が変わった瞬間に音量を0に固定（次の曲での音漏れを完全にガード）
                    if (typeof isMuted !== 'undefined' && isMuted && e.target && e.target.setVolume) {
                        e.target.setVolume(0);
                    }
                    if (typeof onPlayerStateChange === 'function') onPlayerStateChange(e);
                },
                'onError': (e) => {
                    const errEl = document.getElementById('error-message');
                    if (errEl) errEl.style.display = "block";
                    window.isCurrentVideoError = true;
                }
            }
        });
    };
    // --- 修正：ここまで ---

    const updateVolumeUI = (val) => {
        const ratio = quizInfo.volumeRatio || 1.0;
        const finalVolume = Math.min(100, Math.floor(val * ratio));
        document.getElementById('volume-val').innerText = val;
        
        // ★修正：音量バーの値によってミュート状態フラグを厳密に切り替える
        if (val > 0) {
            if (player?.unMute) player.unMute();
            isMuted = false; // 0より大きければミュート解除
        } else {
            if (player?.mute) player.mute();
            isMuted = true;  // 0にされたら自動的にミュート状態（isMuted = true）にする
        }
        
        if(player?.setVolume) player.setVolume(finalVolume);
        document.getElementById('mute-btn').innerText = val == 0 ? "🔇" : "🔈";
    };

    const toggleMute = () => {
        const slider = document.getElementById('volume-slider');
        if(!isMuted) { 
            lastVolume = slider.value; 
            isMuted = true; 
            updateVolumeUI(0); 
            slider.value = 0; 
            if(player && player.setVolume) player.setVolume(0); // ★手動ミュート時、物理的にも音量を0にして音漏れを完全に遮断
        } 
        else { 
            isMuted = false; 
            const restoreVol = lastVolume > 0 ? lastVolume : 50;
            updateVolumeUI(restoreVol); 
            slider.value = restoreVol; 
            if(player && player.setVolume) {
                const ratio = (typeof quizInfo !== 'undefined' && quizInfo.volumeRatio) || 1.0;
                player.setVolume(Math.min(100, Math.floor(restoreVol * ratio))); // ★ミュート解除時、元の音量に復元
            }
        }
    };

    function listenToSignals() {
        if (window.__signals_initialized) return;
        window.__signals_initialized = true;
        // --- 修正箇所ここから ---
        // 全画面ボタンの動作設定
        const fsBtn = document.getElementById('fullscreen-btn');
        if (fsBtn) {
            fsBtn.addEventListener('click', () => {
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) { el.requestFullscreen(); }
                    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
                    fsBtn.textContent = "解除";
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                    fsBtn.textContent = "全画面";
                }
            });
        }
        // --- 修正箇所：全画面状態の変化を監視してDB報告 ＋ ボタン文字も連動させる ---
        document.addEventListener('fullscreenchange', () => {
            const isFull = !!document.fullscreenElement;
            // 1. DBに全画面状態を報告（既存のまま）
            update(ref(db, `game/users/${myId}`), { isFullscreen: isFull });
            
            // 2. ESCキー解除にも対応できるよう、ボタンの文字を現在の状態に強制同期
            const fsBtn = document.getElementById('fullscreen-btn');
            if (fsBtn) {
                fsBtn.textContent = isFull ? "解除" : "全画面";
            }
        });

        // Safari用
        document.addEventListener('webkitfullscreenchange', () => {
            const isFull = !!document.webkitFullscreenElement;
            // 1. DBに全画面状態を報告（既存のまま）
            update(ref(db, `game/users/${myId}`), { isFullscreen: isFull });
            
            // 2. ボタンの文字を同期
            const fsBtn = document.getElementById('fullscreen-btn');
            if (fsBtn) {
                fsBtn.textContent = isFull ? "解除" : "全画面";
            }
        });

        onValue(ref(db, 'game/settings'), (snap) => {
            const data = snap.val();
            if(!data) return;
            // 強制退出コマンドのチェック（主催者以外）
            if (!isAdmin && data.forceExit) {
                alert('主催者によって退出させられました。');
                window.location.href = 'index.html'; // 退出先のURL
                return;
            }
            // 閉鎖モードのチェック（参加中に閉鎖された場合）
            const joinBtn = document.getElementById('btn-join-player');
            const closeMsg = document.getElementById('closed-message');
            if (joinBtn) {
                if (data.isClosed) {
                    joinBtn.style.setProperty('display', 'none', 'important');
                    if (closeMsg) closeMsg.innerText = "【現在、このルームは閉鎖されています】";
                } else {
                    joinBtn.style.setProperty('display', 'block', 'important');
                    if (closeMsg) closeMsg.innerText = "";
                }
            }
            // quizInfo = data; // ← ここにあったこの行を消して、下の「判定の後」へ移動させます。
            
            // --- リセット判定を先に行います ---
            if (data.round !== quizInfo.round || data.videoId !== lastVideoId) {
                hasPointedTitle = false;
                hasPointedArtist = false;
                roundPointsEarned = 0;
                window.is1stPointAwarded = false; 
            }

            quizInfo = data; // ここで新しいデータに更新します
            window.is1stPointAwarded = false; // 全体の1位フラグもリセット

            // --- 選択肢モードのUI制御ここから追加 ---
            const choiceArea = document.getElementById('choice-container');
            const answerInput = document.getElementById('answer-input');
            const sendBtn = document.getElementById('btn-send-answer');

            if (quizInfo.isChoiceMode) {
                // 選択肢モード中の表示
                if (choiceArea) choiceArea.style.display = 'none';
                if (answerInput) {
                    answerInput.disabled = true; 
                    answerInput.placeholder = "選択肢から選んでください";
                }
                if (sendBtn) sendBtn.disabled = true;

                // ボタンに選択肢テキストをセットし、状態をリセット
                const btns = document.querySelectorAll('.choice-btn');
                if (quizInfo.choices && quizInfo.choices.length > 0) {
                    quizInfo.choices.forEach((text, i) => {
                        if (btns[i]) {
                            btns[i].innerText = text;
                            btns[i].disabled = false; // 回答権を復活（新ラウンドのため）
                            btns[i].style.background = "rgba(0, 0, 0, 0.8)"; // 背景を初期化
                            btns[i].style.borderColor = "var(--primary-color)"; // 枠線を初期化
                        }
                    });
                }

                // --- ここを追加：カウントダウン終了（READY?が消える）を待って表示 ---
                // 3000ms（3秒）など、あなたのカウントダウン秒数に合わせて数値を調整してください
                setTimeout(() => {
                    if (quizInfo.isChoiceMode && choiceArea) {
                        choiceArea.style.display = 'flex';
                    }
                }, 5500); 

            } else {
                // 通常モード（イントロ・クイズ・モザイク）
                if (choiceArea) choiceArea.style.display = 'none';
                if (answerInput) {
                    answerInput.disabled = false;
                    answerInput.placeholder = "答えを入力...";
                }
                if (sendBtn) sendBtn.disabled = false;

    // ★追加：通常モードの時も、新しい曲が始まったらパスボタンを復活させる
    const passBtn = document.getElementById('btn-pass') || document.getElementById('pass-btn');
    if (passBtn) {
        passBtn.disabled = false; // ボタンを復活させる
        passBtn.style.opacity = "1.0"; // 薄暗さを元に戻す
    }
}
            // --- 選択肢モードのUI制御ここまで ---
            
            const slider = document.getElementById('volume-slider');
            updateVolumeUI(slider.value);

            if(data.videoId && data.videoId !== lastVideoId) {
                lastVideoId = data.videoId;
                if (player && player.cueVideoById) {
                    player.cueVideoById({ 
                        videoId: data.videoId, 
                        startSeconds: data.startTimeOffset || 0 
                    });
                }
                document.getElementById('error-message').style.display = "none";
                window.isCurrentVideoError = false;
                document.getElementById('video-cover').style.display = "flex";
                document.getElementById('ready-text').style.display = "block";
                document.getElementById('countdown-container').style.display = "none";
                document.getElementById('play-sec-preview').style.display = "none";
                document.getElementById('quiz-question-display').style.display = "none";
                document.getElementById('quiz-timer-display').style.display = "none";
                document.getElementById('quiz-start-overlay').style.display = "none";
                
                const mosaic = document.getElementById('mosaic-overlay');
                const mask = document.getElementById('quiz-title-mask');
                
                if (quizInfo.isMosaicMode) {
                    mosaic.style.display = "none"; 
                    mask.style.display = "none";
                } else if (quizInfo.isQuizMode) {
                    mosaic.style.display = "none";
                    mask.style.display = "block";
                } else {
                    mosaic.style.display = "none";
                    mask.style.display = "none";
                }
                
                if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);

                // 動画IDではなく、Round番号の更新をトリガーにします
                if (data.round !== quizInfo.round || data.videoId !== lastVideoId) {
                    hasPointedTitle = false;
                    hasPointedArtist = false;
                    roundPointsEarned = 0;
                    window.is1stPointAwarded = false; 
                }
                
                isRevealedGlobal = false;
                isFirstPlayOfRound = true;
                document.getElementById('result-notice').style.display = "none";
                document.getElementById('fastest-ranking').style.display = "none";
                currentRankingVisible = false;
                window.is1stPointAwarded = false; 

                if (quizInfo.isQuizMode) {
                    document.getElementById('quiz-question-display').innerText = quizInfo.questionText;
                    document.getElementById('quiz-question-display').style.display = "block";
                }
            }
            document.getElementById('round-text').innerText = `ROUND ${quizInfo.round || 0}`;
            if(isAdmin) {
                document.getElementById('admin-round-text').innerText = `Round: ${quizInfo.round || 0}`;
                if (quizInfo.isQuizMode) {
                    document.getElementById('admin-answer-preview').innerText = `クイズ答え: ${quizInfo.title}`;
                } else {
                    document.getElementById('admin-answer-preview').innerText = `答え: ${quizInfo.title} / ${quizInfo.artist}`;
                }
            }
        });

        onValue(ref(db, 'game/signal'), (snap) => {
            const sig = snap.val(); 
            if(!sig || !player) return;

            if(sig.type === 'countdown') {
                const container = document.getElementById('countdown-container');
                const countDisp = document.getElementById('countdown-display');
                const line = document.getElementById('countdown-line');
                const readyText = document.getElementById('ready-text');
                const previewText = document.getElementById('play-sec-preview');

                readyText.style.display = "none";
                container.style.display = "flex";
                previewText.style.display = "block";
                previewText.innerText = `再生時間: ${sig.duration || 0}秒`;
                
                countDisp.innerText = sig.value;
                line.style.animation = 'none';
                line.offsetHeight; 
                line.style.animation = 'spin 1s linear forwards';

            } else if(sig.type === 'quiz_countdown') {
                const overlay = document.getElementById('quiz-start-overlay');
                overlay.style.display = "flex";
                overlay.innerText = sig.value;
                
                document.getElementById('ready-text').style.display = "none";
                document.getElementById('video-cover').style.display = "flex";
                
                const mask = document.getElementById('quiz-title-mask');
                
                if (quizInfo.isQuizMode && !quizInfo.isMosaicMode) {
                    mask.style.display = "block";
                }

            } else if(sig.type === 'play') {
                document.getElementById('countdown-container').style.display = "none";
                document.getElementById('play-sec-preview').style.display = "none";
                document.getElementById('quiz-start-overlay').style.display = "none";

                if (window.quizTimer) clearTimeout(window.quizTimer);
                if (window.quizCountdownInterval) clearInterval(window.quizCountdownInterval);
                if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);

                player.unMute();
                player.playVideo(); 
                player.seekTo(quizInfo.startTimeOffset || 0, true); 
                const correction = 100; 
                const duration = Math.max(0, (sig.value * 1000) - correction);
                window.quizTimer = setTimeout(() => { 
                    player.pauseVideo(); 
                    document.getElementById('quiz-timer-display').style.display = "none";
                    document.getElementById('mosaic-overlay').style.display = "none";
                    if (window.quizCountdownInterval) clearInterval(window.quizCountdownInterval);
                }, duration);
                isFirstPlayOfRound = false;

                if (quizInfo.isQuizMode) {
                    document.getElementById('video-cover').style.display = "none";
                    document.getElementById('player').style.opacity = "1";
                    document.getElementById('quiz-question-display').style.display = "block";
                    
                    const mask = document.getElementById('quiz-title-mask');
                    const mosaic = document.getElementById('mosaic-overlay');
                    
                    if (quizInfo.isMosaicMode) {
                        mask.style.display = "none";
                        mosaic.style.display = "block";
                        mosaic.style.backdropFilter = "blur(50px)";
                    } else {
                        mosaic.style.display = "none";
                        mask.style.display = "block";
                        window.titleMaskTimer = setTimeout(() => {
                            mask.style.display = "none";
                        }, 10000);
                    }

                    const timerDisp = document.getElementById('quiz-timer-display');
                    timerDisp.style.display = "block";
                    let timeLeft = 15;
                    timerDisp.innerText = timeLeft;
                    window.quizCountdownInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft >= 0) {
                            timerDisp.innerText = timeLeft;
                            if (quizInfo.isMosaicMode) {
                                const blurVal = (timeLeft / 15) * 50;
                                mosaic.style.backdropFilter = `blur(${blurVal}px)`;
                            }
                        }
                        if(timeLeft <= 0) clearInterval(window.quizCountdownInterval);
                    }, 1000);
                }

            } else if(sig.type === 'reveal') {
                isRevealedGlobal = true; 
                if (window.quizTimer) clearTimeout(window.quizTimer);
                if (window.quizCountdownInterval) clearInterval(window.quizCountdownInterval);
                if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);
                document.getElementById('quiz-title-mask').style.display = "none";
                document.getElementById('mosaic-overlay').style.display = "none";

                // 1. まず最初に開示フラグを true にする（これで prevScore の隠蔽制限が解除されます）
                isRevealedGlobal = true;
                
                // --- 選択肢モード時は正解者だけに正解通知を出す ---
                if (quizInfo.isChoiceMode) {
                    if (hasPointedTitle) {
                        showNotice(`正解！ ${quizInfo.title} / ${quizInfo.artist}`, "var(--success-green)");
                    }
                } else {
                    showNotice(`${quizInfo.title} / ${quizInfo.artist}`, "var(--success-green)");
                }

                // ★修正：手動ミュート中のユーザーはミュートと音量0を維持し、それ以外のユーザーのみ音量を100にして再生します
                if (typeof isMuted !== 'undefined' && isMuted) {
                    if (player && player.mute) player.mute();
                    if (player && player.setVolume) player.setVolume(0);
                } else {
                    player.unMute();
                    // ★修正：強制的な音量100を廃止し、参加者自身が設定している音量スライダーの値をそのまま適用します（曲ごとの比率 ratio も安全に計算されます）
                    const currentVolSlider = document.getElementById('volume-slider');
                    if (currentVolSlider && typeof updateVolumeUI === 'function') {
                        updateVolumeUI(currentVolSlider.value);
                    } else if (player && player.setVolume) {
                        // 万が一のためのセーフティガードとして、関数がない場合は既存の100を維持します
                        player.setVolume(100);
                    }
                }
                player.playVideo();

                document.getElementById('video-cover').style.display = "none";
                document.getElementById('quiz-timer-display').style.display = "none";

                // --- 【根本解決】データ通信は行わず、手元にある最新スコアでHTMLを一瞬で再描画する ---
                // 最初に見せていただいた「users.forEach...」の入ったリスト描画関数をここで直接実行します。
                // これにより、隠されていた u.score が一瞬で全員の画面に解禁されて表示されます。
                if (typeof renderUserList === 'function') {
                    renderUserList();
                } else if (typeof updateUserList === 'function') {
                    updateUserList();
                } else if (typeof renderUsers === 'function') {
                    renderUsers();
                }
                const answerInput = document.getElementById('answer-input');
                const sendBtn = document.getElementById('btn-send-answer');

                if (answerInput) {
                    answerInput.disabled = false;
                    answerInput.placeholder = "答えを入力...";
                }
                if (sendBtn) {
                    sendBtn.disabled = false;
                }
                const playerEl = document.getElementById('player');
                if (playerEl) playerEl.style.opacity = "1";
                if (quizInfo.isQuizMode) document.getElementById('quiz-question-display').style.display = "block";
            } else if(sig.type === 'pause_video') {
                if (player && player.pauseVideo) {
                    player.pauseVideo();
                }
            } else if(sig.type === 'ranking_toggle') {
                const panel = document.getElementById('fastest-ranking');
                if(sig.value) { renderRanking(); panel.style.display = "block"; } else { panel.style.display = "none"; }
            } else if(sig.type === 'show_video') {
                const playerEl = document.getElementById('player');
                document.getElementById('video-cover').style.display = sig.value ? "none" : "flex";
                if (playerEl) playerEl.style.opacity = sig.value ? "1" : "0";
                if (quizInfo.isQuizMode) document.getElementById('quiz-question-display').style.display = "block";
            } else if(sig.type === 'seek') {
                if (player && player.seekTo && !isAdmin) {
                    player.seekTo(sig.value, true);
                }
            }
        });
        onValue(ref(db, 'game/settings/bannedUsers'), (snap) => {
            const bannedList = snap.val() || {};
            // 自身がBANされていたらリロードして追い出す
            if (bannedList[myId]) {
                alert("アクセス権限がありません。");
                location.reload();
            }
            // 管理者の場合のみ解除リストを表示
            if (isAdmin) {
                const banListArea = document.getElementById('ban-list-display');
                if (banListArea) {
                    banListArea.innerHTML = "<b>BAN中:</b> ";
                    Object.keys(bannedList).forEach(bid => {
                        const btn = document.createElement('button');
                        btn.innerText = `解除:${bid.substring(0,5)}`;
                        btn.onclick = () => unbanUser(bid);
                        btn.style.margin = "0 2px";
                        btn.style.fontSize = "10px";
                        banListArea.appendChild(btn);
                    });
                }
            }
        });

        onValue(ref(db, 'game/users'), (snap) => {
            const usersData = snap.val() || {};
            const usersArray = Object.values(usersData);
            
            // 自分(myId)を除いたオンライン人数をカウントする
            const otherOnlineCount = usersArray.filter(u => u.id !== myId && u.isOnline === true).length;
            const MAX_CONNECTION = 100; 

            // 管理者ではなく、自分以外のオンライン人数が上限(100)に達している場合のみ制限
            // (100人目として自分が入れる余裕がある場合は通す)
            if (!isAdmin && otherOnlineCount >= MAX_CONNECTION) {
                alert(`現在、満員（${MAX_CONNECTION}名）のため入場できません。`);
                return location.href = "about:blank"; 
            }
            const list = document.getElementById('user-list'); list.innerHTML = "";
            const users = []; snap.forEach(c => { const u = c.val(); if(u?.name) users.push(u); });
            const maxScore = users.length > 0 ? Math.max(...users.map(u => u.score || 0)) : 0;
            users.sort((a,b) => {
                if (a.isAdmin !== b.isAdmin) return a.isAdmin ? -1 : 1;
                if (a.isOnline !== b.isOnline) return a.isOnline ? -1 : 1;
                if (b.score !== a.score) return b.score - a.score;
                return a.joinedAt - b.joinedAt;
            });
            users.forEach(u => {
                const div = document.createElement('div');
                div.className = `user-card ${u.id === myId ? 'is-me' : ''} ${u.isAdmin ? 'is-admin' : ''}`;
                const isOnline = u.isOnline === true;
                if (u.id === myId) {
                    hasPointedTitle = u.hasPointedTitle || false;
                }

                // 1. スコアの計算
                let displayScore = u.score || 0;
                if (!isAdmin && !isRevealedGlobal) {
                    if (u.prevScore !== undefined) displayScore = u.prevScore;
                }

                // 2. 各種ステータス（記号・マーク）の準備
                let currentMax = maxScore;
                if (!isAdmin && !isRevealedGlobal) {
                    // 安全対策：usersが配列でもオブジェクトでもエラーを出さずに最高得点を計算します
                    const userArray = Array.isArray(users) ? users : Object.values(users || {});
                    if (userArray.length > 0) {
                        currentMax = Math.max(...userArray.map(user => user.isAdmin ? 0 : (user.prevScore !== undefined ? user.prevScore : (user.score || 0))));
                    }
                }

                const isTop = (displayScore > 0 && displayScore === currentMax);
                const crown = isTop ? '<span class="crown">👑</span>' : '';
                
                // 消えてしまっていた正解マークの行もここに復活させて安全に合流させます
                const correctMark = ((isAdmin || isRevealedGlobal) && u.hasCorrectedTitle) ? '<span class="correct-mark">正解</span>' : '';
                
                // ★修正：アーティスト正解マークの行を新設（「正解」マークの右隣に並びます。色などを変えたい場合はクラス名でCSS調整可能です）
                const artistCorrectMark = ((isAdmin || isRevealedGlobal) && u.hasCorrectedArtist) ? '<span class="artist-correct-mark" style="color: #ffca28; font-size: 10px; margin-left: 5px; font-weight: bold; border: 1px solid #ffca28; padding: 1px 3px; border-radius: 3px;">アーティスト正解</span>' : '';

                // 全画面判定（ここから下は既存のコードのままです）
                const fullStatus = u.isFullscreen 
                    ? '<span style="color:green; font-size:10px; margin-left:5px; font-weight:bold;">[全画面]</span>' 
                    : '<span style="color:#aaa; font-size:10px; margin-left:5px;">[通常]</span>';

                // 3. パスと離席の組み立て
                let statusParts = [];
                if (!isOnline) statusParts.push("<small style='color:#888;'>(離席)</small>");
                // 管理者または自分自身ならパス状態を表示
                if ((isAdmin || u.id === myId) && u.isPass) {
                    statusParts.push("<span style='color:#ff8c00; font-weight:bold; margin-left:5px;'>[パス]</span>");
                }
                const statusText = statusParts.length > 0 ? " " + statusParts.join(" ") : "";

                // 4. ボタンとスコア表示
                const banBtn = (isAdmin && !u.isAdmin) ? `<button onclick="banUser('${u.id}')" style="font-size:10px; margin-left:5px; padding:2px 4px; border-radius:4px; border:none; background:#ff4d4d; color:white; cursor:pointer;">BAN</button>` : '';
                const scoreDisplay = u.isAdmin ? "" : `<b>${displayScore} pt</b>`;

                // ★修正2：確実にデータを反映させるため、Firebaseのデータベース（ref(db, 'game/chats')）の最新情報、またはローカルに保持されている正しいデータソースから名前が一致する正解・回答履歴を1件ずつ正確に照合・集計する処理を挟みます。
                // 主催者側かつクリック時にその場で最新データを集計してアラート表示する関数を要素に直接仕込みます
                if (isAdmin) {
                    div.style.cursor = "pointer"; // クリックできることを分かりやすく
                    div.onclick = async (e) => {
                        // 誤動作防止（BANボタンなどのクリック時は発動しない）
                        if (e.target.tagName === 'BUTTON') return;

                        // 各データの集計用変数
                        let roundDetails = {}; // ラウンドごとの集計（獲得pt、早解き順位）
                        let total1stCount = 0; // 通算1位の回数
                        let total2ndCount = 0; // 通算2位の回数
                        let total3ndCount = 0; // 通算3位の回数
                        
                        // 照合用：現在のユーザーIDおよび名前の抽出
                        const currentUserId = (typeof uid !== 'undefined' ? uid : (typeof key !== 'undefined' ? key : (u.id || "")));
                        const cleanTargetName = u.name ? String(u.name).split('#')[0].trim().toLowerCase() : "";

                        try {
                            // 1. 最新のチャット履歴を取得
                            const cSnap = await get(ref(db, 'game/chats'));
                            
                            if (cSnap.exists()) {
                                cSnap.forEach(c => {
                                    const d = c.val();
                                    if (!d) return;
                                    
                                    const chatUserId = d.userId || "";
                                    const chatUserName = d.user ? String(d.user).split('#')[0].trim().toLowerCase() : "";
                                    
                                    if (
                                        (currentUserId && chatUserId && currentUserId === chatUserId) ||
                                        (cleanTargetName && chatUserName && cleanTargetName === chatUserName)
                                    ) {
                                        const rNum = Number(d.round);
                                        if (rNum) {
                                            if (!roundDetails[rNum]) {
                                                roundDetails[rNum] = { pts: 0, rank: "圏外" };
                                            }
                                        }
                                    }
                                });
                            }

                            // 現在進行中の最新ラウンド（quizInfo.round）の獲得ポイントをリアルタイム算出
                            const currentRoundNum = Number(quizInfo?.round || 0);
                            if (currentRoundNum > 0) {
                                if (!roundDetails[currentRoundNum]) {
                                    roundDetails[currentRoundNum] = { pts: 0, rank: "圏外" };
                                }
                                const currentScore = Number(u.score || 0);
                                const previousScore = Number(u.prevScore || 0);
                                const diffPoints = Math.max(0, currentScore - previousScore);
                                roundDetails[currentRoundNum].pts = diffPoints;
                            }

                            // 過去の各ラウンドの獲得ポイントの補正
                            if (cSnap.exists()) {
                                cSnap.forEach(c => {
                                    const d = c.val();
                                    if (d && d.round) {
                                        const rNum = Number(d.round);
                                        if (roundDetails[rNum] && rNum !== currentRoundNum) {
                                            let earned = 0;
                                            if (d.earnedPoints) earned = Number(d.earnedPoints);
                                            else if (d.points) earned = Number(d.points);
                                            else if (d.isTitle === true) earned = 5; 
                                            
                                            if (d.isArtist === true && !earned) earned = 1; 

                                            if (earned > 0 && roundDetails[rNum].pts < earned) {
                                                roundDetails[rNum].pts = earned;
                                            }
                                        }
                                    }
                                });

                                // 早解きランキング（1位〜3位）の選出ログを算出
                                let roundsGroup = {};
                                cSnap.forEach(c => {
                                    const d = c.val();
                                    if (d && d.round && d.isTitle === true && d.time) {
                                        const r = Number(d.round);
                                        if (!roundsGroup[r]) roundsGroup[r] = [];
                                        const idf = d.userId || d.user;
                                        if (!roundsGroup[r].find(x => x.id === idf)) {
                                            roundsGroup[r].push({ id: idf, name: d.user, time: Number(d.time) });
                                        }
                                    }
                                });

                                // 各ラウンドごとの順位確定と、このユーザーの通算1〜3位のカウント
                                Object.keys(roundsGroup).forEach(rNum => {
                                    let corrects = roundsGroup[rNum];
                                    corrects.sort((a, b) => a.time - b.time);
                                    
                                    const rNumIdx = Number(rNum);
                                    corrects.slice(0, 10).forEach((item, idx) => {
                                        const cleanItemName = item.name ? String(item.name).split('#')[0].trim().toLowerCase() : "";
                                        if (item.id === currentUserId || (cleanTargetName && cleanItemName && cleanTargetName === cleanItemName)) {
                                            const displayRank = idx + 1;
                                            
                                            if (roundDetails[rNumIdx]) {
                                                roundDetails[rNumIdx].rank = `${displayRank}位`;
                                                
                                                if (rNumIdx !== currentRoundNum) {
                                                    if (displayRank === 1) roundDetails[rNumIdx].pts += 5;
                                                    else if (displayRank === 2) roundDetails[rNumIdx].pts += 3;
                                                    else if (displayRank === 3) roundDetails[rNumIdx].pts += 2;
                                                }
                                            }
                                            
                                            if (displayRank === 1) total1stCount++;
                                            else if (displayRank === 2) total2ndCount++;
                                            else if (displayRank === 3) total3ndCount++;
                                        }
                                    });
                                });
                            }
                        } catch (err) { console.error(err); }

                        // 3. 表示用テキストの組み立て
                        const sortedRounds = Object.keys(roundDetails).map(Number).sort((a, b) => a - b);
                        let roundListText = "";
                        sortedRounds.forEach(r => {
                            const info = roundDetails[r];
                            roundListText += `・第${r}問: ${info.pts}pt 獲得 [早解き: ${info.rank}]\n`;
                        });
                        if (roundListText === "") roundListText = "なし\n";

                        // ★動的モーダル生成：ブラウザ固有のalertを廃止し、拡大ズームが効く大きな文字の自作ポップアップを表示します
                        const oldModal = document.getElementById('history-custom-modal');
                        if (oldModal) oldModal.remove();

                        const modalText = `
                            <strong style="font-size: 22px; color: #fff; border-bottom: 2px solid #555; padding-bottom: 8px; display: block; margin-bottom: 15px;">【${u.name} さんの参加履歴詳細】</strong>
                            <b style="color: #ffcb28; font-size: 18px;">■ 通算参加数:</b> <span style="font-size: 18px; color: #fff;">${sortedRounds.length}問</span><br><br>
                            <b style="color: #ffcb28; font-size: 18px;">■ 通算早解きトップ3獲得回数:</b><br>
                            <span style="font-size: 18px; color: #fff; padding-left: 10px; display: inline-block; margin-top: 5px;">👑 1位: <b>${total1stCount}</b>回 / 🥈 2位: <b>${total2ndCount}</b>回 / 🥉 3位: <b>${total3ndCount}</b>回</span><br><br>
                            <b style="color: #ffcb28; font-size: 18px;">■ 各ラウンドの明細:</b><br>
                            <div style="font-size: 16px; color: #eee; background: #222; padding: 12px; border-radius: 6px; margin-top: 8px; max-height: 250px; overflow-y: auto; line-height: 1.6;">
                                ${roundListText.replace(/\n/g, '<br>')}
                            </div>
                        `;

                        const modalContainer = document.createElement('div');
                        modalContainer.id = 'history-custom-modal';
                        modalContainer.style = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 99999; font-family: sans-serif;';
                        modalContainer.innerHTML = `
                            <div style="background: #2c2c2c; width: 90%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); position: relative; border: 1px solid #444; box-sizing: border-box;">
                                <button id="close-history-modal" style="position: absolute; top: 12px; right: 15px; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
                                <div style="text-align: left; word-break: break-all;">
                                    ${modalText}
                                </div>
                                <button id="close-history-modal-btn" style="margin-top: 20px; width: 100%; padding: 12px; background: #444; border: none; color: #fff; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">閉じる</button>
                            </div>
                        `;

                        document.body.appendChild(modalContainer);

                        const closeModal = () => modalContainer.remove();
                        document.getElementById('close-history-modal').onclick = closeModal;
                        document.getElementById('close-history-modal-btn').onclick = closeModal;
                        modalContainer.onclick = (event) => {
                            if (event.target === modalContainer) closeModal();
                        };
                    };
                }

                // 5. HTMLを一気に組み立て（title属性を廃止し、クリック可能な構成にします）
                div.innerHTML = `<div>${crown}${u.name}${u.isAdmin ? " <small>(HOST)</small>":""}${statusText}${fullStatus}${correctMark}${artistCorrectMark}${banBtn}</div>${scoreDisplay}`;
                div.style.opacity = isOnline ? "1" : "0.5";
                list.appendChild(div);
            });
            const onlineCount = users.filter(u => u.isOnline === true && !u.isAdmin).length;
            document.getElementById('player-count').innerText = `${onlineCount} ONLINE`;
        });

        onValue(query(ref(db, 'game/chats'), limitToLast(1)), (snap) => {
            if (!snap.exists()) return;
            const data = snap.val();
            const key = Object.keys(data)[0];
            const m = data[key];
            if (window.lastProcessedChatKey === key) return;
            const now = Date.now();
            if (m.time && (now - m.time < 3000)) { window.lastProcessedChatKey = key; showDanmaku(m); }
        });
    }

    function normalize(t) { return t ? t.normalize("NFKC").replace(/[！!？?。．、，\s]/g, "").replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)).toLowerCase() : ""; }
    window.sendPassSignal = () => {
        // ★新設：クリックされた瞬間にパスボタンを無効化（連打を物理的にガード）
        // ※もしボタンのHTML上のidが違っていた場合を想定し、一般的なid名で取得を試みます
        const passBtn = document.getElementById('btn-pass') || document.getElementById('pass-btn');
        if (passBtn) {
            passBtn.disabled = true;
            passBtn.style.opacity = "0.5"; // ボタンを半透明にして「押せない状態」を視覚的に伝える
        }

        pushChat("（パス）", false, false, false, false);
        if (myId) {
            update(ref(db, `game/users/${myId}`), { isPass: true })
                .then(() => {
                    showNotice("パスしました", "#888");
                });
        }
    };
    // --- 1. 得点計算とチャット送信の共通ロジック (これを独立させる) ---
    const processScore = (text, isTitle, isArtist) => {
        // ★修正：すでにこの問題でタイトル正解済みの場合は、裏で処理が連打されても2回目以降はすべて無視して即終了（スコア爆発を完全ガード）
        if (isTitle && hasPointedTitle) {
            return;
        }

        if(isAdmin || isRevealedGlobal) { 
            pushChat(text, false, false); 
            return; 
        }

        const now = Date.now();
        const startTime = quizInfo.startTime || 0;
        
        // カウントダウン中などの判定
        if (startTime === 0 || isRevealedGlobal) {
            pushChat(text, isTitle, isArtist);
            return;
        }

        const sec = quizInfo.currentSeconds || 0;
        let titlePoints = 0; let artistPoints = 0;

        // 得点計算
        if (quizInfo.isQuizMode) {
            const elapsed = (now - startTime) / 1000;
            if (elapsed > 15) titlePoints = 0; else titlePoints = Math.max(1, Math.ceil(15 - elapsed));
        } else {
            if (sec === 1 || sec === 1.5) { titlePoints = 10; artistPoints = 5; }
            else if (sec === 2 || sec === 2.5) { titlePoints = 9; artistPoints = 4; }
            else if (sec === 3) { titlePoints = 8; artistPoints = 3; }
            else if (sec === 5) { titlePoints = 6; artistPoints = 2; }
            else if (sec === 10) { titlePoints = 5; artistPoints = 1; }
        }

        // 正解時の処理
        if (isTitle && !hasPointedTitle) {
            if (roundPointsEarned > 0 || hasPointedTitle) return;

            // ★最重要修正：クイズモード時、画面のタイマー残り時間（timeLeft）が0以下の時は、
            // マイナス計算によるスコア暴走（200ptバグ）を防ぐため、点数加算処理をその場で100%完全に遮断（拒否）します
            if (quizInfo.isQuizMode && typeof timeLeft !== 'undefined' && timeLeft <= 0) {
                return;
            }

            let addedPoints = Math.max(0, titlePoints - roundPointsEarned);
            if (window.is1stPointAwarded) addedPoints = Math.min(addedPoints, 15);

            if (addedPoints > 0) {
                // この問題での合計点を計算
                const totalInThisRound = roundPointsEarned + addedPoints;

                update(ref(db, `game/users/${myId}`), { 
                    score: increment(addedPoints), 
                    hasCorrectedTitle: true,
                    hasPointedTitle: true 
                });
                // 選択肢モードなら中央のデカ通知を隠す
                if (!quizInfo.isChoiceMode) {
                    showCenterNotify(`正解！+${addedPoints}pt(合計${totalInThisRound}pt)`, "var(--success-green)");
                }
                // --- 修正箇所：選択肢クリックからの正解時は、左下非表示・モザイク維持・タイトル消去防止 ---
                if (!quizInfo.isFromChoiceClick) {
                    showNotice(`正解！ ${text} +${addedPoints}pt(合計${totalInThisRound}pt)`, "var(--success-green)");
                    
                    if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);
                    document.getElementById('quiz-title-mask').style.display = "none";
                    document.getElementById('mosaic-overlay').style.display = "none";
                }
                // ---------------------------------------------------------------------------------
                
                roundPointsEarned += addedPoints;
            }
        } else if (!quizInfo.isQuizMode && isArtist && !hasPointedArtist && !hasPointedTitle) {
            // ★最重要修正：アーティスト正解側でも同様に、すでに点数が加算されていれば処理を完全に遮断します
            if (roundPointsEarned > 0 || hasPointedArtist) return;

            const addedPoints = Math.max(0, artistPoints - roundPointsEarned);
            if (addedPoints > 0) {
                // ★修正：アーティスト正解時に hasCorrectedArtist: true をデータベースに保存する
                update(ref(db, `game/users/${myId}`), { 
                    score: increment(addedPoints),
                    hasCorrectedArtist: true
                });
                showCenterNotify(`アーティスト正解！+${addedPoints}pt`, "var(--gold)");
                showNotice(`アーティスト正解！ ${text} +${addedPoints}pt`, "var(--gold)");
                roundPointsEarned += addedPoints;
            }
            hasPointedArtist = true;
        }

        pushChat(text, isTitle, isArtist);
    };

    // --- 2. キーボード入力用の送信処理 ---
    const sendAnswer = () => {
        const input = document.getElementById('answer-input'), text = input.value.trim();
        if(!text) return;

        const clean = (str) => {
            if (!str) return "";
            return str.toLowerCase()
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/[ぁ-ん]/g, (s) => String.fromCharCode(s.charCodeAt(0) + 0x60))
                .replace(/ヴ/g, 'ブ')
                .replace(/[\s　・．。、，,.\-]/g, '');
        };

        const normIn = clean(text);
        const titleCandidates = quizInfo.title.split('.').map(c => clean(c));
        const artistCandidates = quizInfo.artist.split('.').map(c => clean(c));
        const isTitle = titleCandidates.some(c => c !== "" && c === normIn);
        const isArtist = artistCandidates.some(c => c !== "" && c === normIn);

        // おしい判定
        if (!isTitle && !isArtist) {
            const getSim = (s1, s2) => {
                const l1 = s1.length, l2 = s2.length;
                if (l1 === 0 || l2 === 0) return 0;
                const d = Array.from({ length: l1 + 1 }, (_, i) => Array.from({ length: l2 + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
                for (let i = 1; i <= l1; i++) {
                    for (let j = 1; j <= l2; j++) {
                        const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                    }
                }
                return 1 - d[l1][l2] / Math.max(l1, l2);
            };
            const isNear = [...titleCandidates, ...artistCandidates].some(c => c !== "" && getSim(c, normIn) >= 0.7);
            if (isNear) {
                showNotice("おしい！", "#ffa500");
                pushChat(text, false, false, true); 
                input.value = ""; return;
            }
        }

        processScore(text, isTitle, isArtist);
        input.value = "";
    };

    // --- 3. 選択肢ボタン用の送信処理 ---
    window.selectChoice = (idx) => {
        if (isRevealedGlobal) return;
        const btns = document.querySelectorAll('.choice-btn');
        if (!btns[idx]) return;

        const selectedText = btns[idx].innerText;
        btns.forEach(b => b.disabled = true); // 1回切り
        btns[idx].style.background = "var(--accent-blue, #3498db)";
        btns[idx].style.borderColor = "#fff";

        const clean = (str) => str ? str.toLowerCase().replace(/[\s　]/g, '') : "";
        const normIn = clean(selectedText);
        const titleCandidates = quizInfo.title.split('.').map(c => clean(c));
        const isTitle = titleCandidates.some(c => c !== "" && c === normIn);

        // --- 修正箇所：選択肢モードからの判定であることを一時的なプロパティで付与 ---
        quizInfo.isFromChoiceClick = true;

        processScore(selectedText, isTitle, false); 

        // 処理が終わったら目印を解除
        quizInfo.isFromChoiceClick = false;
    };

    const pushChat = (text, isTitle, isArtist, isNear = false, isPass = false) => {
        // displayOverride を廃止し、常に生の text を送ります
        push(ref(db, 'game/chats'), { 
            userId: myId, 
            user: myName, 
            text: text, // ここは常に生身の「もう恋なんてしない」などが送られる
            isTitle, 
            isArtist, 
            isNear, 
            isPass, // ここにパスフラグを追加
            time: serverTimestamp(), 
            round: quizInfo.round 
        });
    };
    const showNotice = (t, c) => { const n = document.getElementById('result-notice'); n.innerText = t; n.style.color = c; n.style.display = "block"; };
    const showCenterNotify = (t, c) => { const p = document.getElementById('video-section'); if(!p) return; const n = document.createElement('div'); n.innerText = t; Object.assign(n.style, { position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', fontSize: '3rem', zIndex: '10000', backgroundColor: 'rgba(0,0,0,0.8)', color: c, padding: '20px', borderRadius: '15px', whiteSpace: 'nowrap' }); p.appendChild(n); setTimeout(() => n.remove(), 2000); };
    const showDanmaku = (m) => {
        // パス信号の場合、主催者以外には何も表示せず終了する
        if (m.isPass && !isAdmin) return;

async function renderRanking() {
        const [chatSnap, timeSnap] = await Promise.all([get(ref(db, 'game/chats')), get(ref(db, 'game/signal_time'))]);
        const startTime = timeSnap.val() || 0;
        const rankPanel = document.getElementById('fastest-ranking');
        const rankList = document.getElementById('rank-list');
        rankList.innerHTML = ""; rankPanel.style.display = "block"; rankPanel.classList.remove('winner-anim');
        if(!chatSnap.exists() || startTime === 0) { rankList.innerHTML = "<div>正解者なし</div>"; return; }
        let corrects = [];
        chatSnap.forEach(c => {
            const d = c.val();
            if(String(d.round) === String(quizInfo.round) && d.isTitle === true && Number(d.time) >= startTime) {
                const identifier = d.userId || d.user;
                if(!corrects.find(x => x.id === identifier)) corrects.push({ id: identifier, user: d.user || "名無し", time: Number(d.time) }); 
            }
        });
        if(corrects.length === 0) { rankList.innerHTML = "<div>正解者なし</div>"; return; }
        corrects.sort((a, b) => a.time - b.time);
        const top10 = corrects.slice(0, 10);
        const elements = [];
        top10.forEach((item, idx) => {
            const div = document.createElement('div'); 
            
            // ★修正：1位、2位、3位にそれぞれ相応のクラスと記号を付与して見た目を豪華にする
            let rankClass = '';
            let rankBadge = '';
            if (idx === 0) { rankClass = 'is-1st'; rankBadge = '👑 '; }
            else if (idx === 1) { rankClass = 'is-2nd'; rankBadge = '🥈 '; }
            else if (idx === 2) { rankClass = 'is-3rd'; rankBadge = '🥉 '; }
            
            div.className = `rank-item ${rankClass}`;
            const sec = (item.time - startTime) / 1000; 
            div.innerHTML = `<span>${rankBadge}${idx + 1}位: ${item.user}</span><span>${sec.toFixed(2)}s</span>`;
            rankList.appendChild(div); 
            
            // 後段のループ処理用に順位情報(rankIndex)を持たせる
            elements.push({ el: div, rankIndex: idx, userId: item.id });
        });

        // 10位（配列の最後）から1位（配列の先頭）に向かって逆順に表示させる
        for (let i = elements.length - 1; i >= 0; i--) { 
            const target = elements[i]; 
            
            // ★修正：順位が上になるほど相応に表示時間をタメる（1位: 2000ms / 2位: 1200ms / 3位: 800ms / その他: 400ms）
            let delay = 500;
            if (target.rankIndex === 0) delay = 2000;
            else if (target.rankIndex === 1) delay = 1200;
            else if (target.rankIndex === 2) delay = 800;
            
            await new Promise(r => setTimeout(r, delay)); 
            target.el.classList.add('show'); 
            
            // ★修正：1位、2位、3位のポイント加算処理（1位: 5pt / 2位: 3pt / 3位: 2pt）
            if (isAdmin && !window.is1stPointAwarded) {
                if (target.rankIndex === 0) {
                    rankPanel.classList.add('winner-anim');
                    update(ref(db, `game/users/${target.userId}`), { score: increment(5) });
                } else if (target.rankIndex === 1) {
                    update(ref(db, `game/users/${target.userId}`), { score: increment(3) });
                } else if (target.rankIndex === 2) {
                    update(ref(db, `game/users/${target.userId}`), { score: increment(2) });
                }
            }
        }
        
        // すべての順位のポイント処理が終わったらフラグを立てる
        if (isAdmin) {
            window.is1stPointAwarded = true;
        }
    }

                return alert("選択肢1〜4をすべて入力してください。");
            }

            let line = url + "*";
            if (type === 'quiz') line += `!!${question}*${title}`;
            else if (type === 'mosaic') line += `""${question}*${title}`;
            // ★新設：選択肢クイズなら $!、選択肢モザイクなら $" の形式に組み立てる
            else if (type === 'choice_quiz') line += `$!${question}*${c1}*${c2}*${c3}*${c4}`;
            else if (type === 'choice_mosaic') line += `$"${question}*${c1}*${c2}*${c3}*${c4}`;
            else line += `${title}*${artist}`;
            
            line += `*${vol}`;
            
            const area = document.getElementById('reserve-area');
            area.value += (area.value ? "\n" : "") + line;
            
            // 入力欄をすべて綺麗にリセット
            document.getElementById('mq-url').value = ""; 
            document.getElementById('mq-title').value = ""; 
            document.getElementById('mq-artist').value = ""; 
            document.getElementById('mq-question').value = "";
            if(document.getElementById('mq-choice1')) document.getElementById('mq-choice1').value = "";
            if(document.getElementById('mq-choice2')) document.getElementById('mq-choice2').value = "";
            if(document.getElementById('mq-choice3')) document.getElementById('mq-choice3').value = "";
            if(document.getElementById('mq-choice4')) document.getElementById('mq-choice4').value = "";
            
            qModal.style.display = 'none';
        };
        // --- ここから追加：全画面状態の監視 ---
        document.addEventListener('fullscreenchange', () => {
            if (myId) {
                // 現在全画面かどうかを判定（nullでなければ全画面中）
                const isFS = !!document.fullscreenElement;
                // Firebaseの自分のデータに状態を書き込む
                update(ref(db, `game/users/${myId}`), { isFullscreen: isFS });
            }
        });
        // --- ここまで追加 ---
    });
    // --- ここから追加 ---
    /**
     * ユーザーをBANする関数
     * @param {string} userId - 対象ユーザーのID
     */
    window.banUser = async (userId) => {
        if(!isAdmin || !confirm("このユーザーをBANしますか？")) return;
        
        try {
            // 1. BANリスト（bannedUsers）に登録
            await update(ref(db, `game/settings/bannedUsers`), { [userId]: true });
            
            // 2. ユーザーリストから削除して即座に退場させる
            await remove(ref(db, `game/users/${userId}`));
            
            console.log("User banned:", userId);
        } catch (e) {
            console.error("BAN失敗:", e);
        }
    };

    /**
     * BANを解除する関数
     * @param {string} userId - 解除するユーザーのID
     */
    window.unbanUser = async (userId) => {
        if(!isAdmin || !confirm("このユーザーのBANを解除しますか？")) return;
        
        try {
            // BANリストから削除
            await remove(ref(db, `game/settings/bannedUsers/${userId}`));
            alert("解除しました。再入場可能です。");
        } catch (e) {
            console.error("解除失敗:", e);
        }
    };
// --- ここまで追加 ---
</script>
