    /**
     * ★追加：全参加者の正解履歴を1つのテキストファイルとして出力する
     * 既存の「参加者クリックで個別履歴を見る」ロジックと同じ集計方式を、全員分まとめて行う
     */
    const exportFullLog = async () => {
        if (!isAdmin) return;
        try {
            const [usersSnap, hSnap] = await Promise.all([
                get(ref(db, 'game/users')),
                get(ref(db, 'game/history'))
            ]);

            if (!usersSnap.exists()) { alert("参加者データがありません"); return; }

            // 全ラウンドの履歴データを { round: { userId: {...} } } の形で保持
            const historyByRound = {};
            if (hSnap.exists()) {
                hSnap.forEach(roundSnap => {
                    historyByRound[Number(roundSnap.key)] = roundSnap.val() || {};
                });
            }
            const sortedRoundNums = Object.keys(historyByRound).map(Number).sort((a, b) => a - b);

            const usersData = usersSnap.val();
            // 参加日時順に並べる（既存の参加者リストと同じ並び方に寄せる）
            const userList = Object.values(usersData).filter(u => u && u.name && !u.isAdmin);
            userList.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

            let output = `===== INTRO DON! 大会結果ログ (出力日時: ${dateStr}) =====\n`;
            output += `参加人数: ${userList.length}人 / 総ラウンド数: ${sortedRoundNums.length}問\n\n`;

            userList.forEach(u => {
                let total1st = 0, total2nd = 0, total3rd = 0;
                let roundLines = "";
                let participatedCount = 0;

                sortedRoundNums.forEach(rNum => {
                    const entry = historyByRound[rNum] ? historyByRound[rNum][u.id] : null;
                    if (!entry) return;
                    participatedCount++;
                    const pts = entry.ptsDisplay || "0pt";
                    let rankText = "圏外";
                    const rVal = entry.rank;
                    if (rVal === 1) { rankText = "1位"; total1st++; }
                    else if (rVal === 2) { rankText = "2位"; total2nd++; }
                    else if (rVal === 3) { rankText = "3位"; total3rd++; }
                    else if (typeof rVal === 'string') { rankText = rVal; }
                    roundLines += ` ・第${rNum}問: ${pts} 獲得 [早解き: ${rankText}]\n`;
                });

                output += `【${u.name}】（最終スコア: ${u.score || 0}pt）\n`;
                output += `■ 通算参加数: ${participatedCount}問\n`;
                output += `■ 通算早解きトップ3獲得回数: 1位:${total1st}回 / 2位:${total2nd}回 / 3位:${total3rd}回\n`;
                output += `■ 各ラウンドの明細:\n`;
                output += (roundLines || " ・参加履歴なし\n");
                output += `\n`;
            });

            // ダウンロード実行
            const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `introdon_log_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}.txt`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (e) {
            console.error("ログ出力エラー:", e);
            alert("ログ出力中にエラーが発生しました");
        }
    };

async function renderRanking() {
        const [chatSnap, timeSnap] = await Promise.all([get(ref(db, 'game/chats')), get(ref(db, 'game/signal_time'))]);
        const startTime = timeSnap.val() || 0;
        const rankPanel = document.getElementById('fastest-ranking');
        const rankList = document.getElementById('rank-list');
        rankList.innerHTML = ""; rankPanel.style.display = "block"; rankPanel.classList.remove('winner-anim');
        if(!chatSnap.exists() || startTime === 0) { rankList.innerHTML = "<div>正解者なし</div>"; return; }
        let corrects = [];
        chatSnap.forEach(c => {
            const d = c.val();
            if(String(d.round) === String(quizInfo.round) && d.isTitle === true && Number(d.time) >= startTime) {
                const identifier = d.userId || d.user;
                if(!corrects.find(x => x.id === identifier)) corrects.push({ id: identifier, user: d.user || "名無し", time: Number(d.time) }); 
            }
        });
        if(corrects.length === 0) { rankList.innerHTML = "<div>正解者なし</div>"; return; }
        corrects.sort((a, b) => a.time - b.time);
        const top10 = corrects.slice(0, 10);
        const elements = [];
        top10.forEach((item, idx) => {
            const div = document.createElement('div'); 
            
            // ★修正：1位、2位、3位にそれぞれ相応のクラスと記号を付与して見た目を豪華にする
            let rankClass = '';
            let rankBadge = '';
            if (idx === 0) { rankClass = 'is-1st'; rankBadge = '👑 '; }
            else if (idx === 1) { rankClass = 'is-2nd'; rankBadge = '🥈 '; }
            else if (idx === 2) { rankClass = 'is-3rd'; rankBadge = '🥉 '; }
            
            div.className = `rank-item ${rankClass}`;
            const sec = (item.time - startTime) / 1000; 
            div.innerHTML = `<span>${rankBadge}${idx + 1}位: ${item.user}</span><span>${sec.toFixed(2)}s</span>`;
            rankList.appendChild(div); 
            
            // 後段のループ処理用に順位情報(rankIndex)を持たせる
            elements.push({ el: div, rankIndex: idx, userId: item.id });
        });

        // ★修正：ループに入る前に全員分のhistoryを一括取得しておく（通信遅延による競合を防ぐ）
        const preloadedHistory = {};
        if (isAdmin) {
            const roundHistorySnap = await get(ref(db, `game/history/${quizInfo.round}`));
            if (roundHistorySnap.exists()) {
                roundHistorySnap.forEach(child => {
                    preloadedHistory[child.key] = child.val();
                });
            }
        }

        // 10位（配列の最後）から1位（配列の先頭）に向かって逆順に表示させる
        for (let i = elements.length - 1; i >= 0; i--) { 
            const target = elements[i]; 
            
            // ★修正：順位が上になるほど相応に表示時間をタメる（1位: 2000ms / 2位: 1200ms / 3位: 800ms / その他: 400ms）
            let delay = 500;
            if (target.rankIndex === 0) delay = 2000;
            else if (target.rankIndex === 1) delay = 1200;
            else if (target.rankIndex === 2) delay = 800;
            
            await new Promise(r => setTimeout(r, delay)); 
            target.el.classList.add('show'); 
            // ★追加：1位が表示された瞬間、全員の画面に紙吹雪を出す
            if (target.rankIndex === 0 && typeof triggerConfetti === 'function') {
                triggerConfetti();
            }
            
            // ★修正：1位、2位、3位のポイント加算処理（1位: 5pt / 2位: 3pt / 3位: 2pt）
            if (isAdmin && !window.is1stPointAwarded) {
                const bonusMap = { 0: 5, 1: 3, 2: 2 };
                let bonus = bonusMap[target.rankIndex];
                // ★追加：チャンスタイム中（ポイント2倍ラウンド）は早解きボーナスも倍率をかける
                if (bonus !== undefined && quizInfo.pointMultiplier > 1) {
                    bonus = bonus * quizInfo.pointMultiplier;
                }
                const rankNum = target.rankIndex + 1;
                if (bonus !== undefined) {
                    if (target.rankIndex === 0) rankPanel.classList.add('winner-anim');
                    update(ref(db, `game/users/${target.userId}`), { score: increment(bonus) });
                    // ★修正：ループ前に取得済みのデータを使うことで通信遅延を回避
                    const existingEntry = preloadedHistory[target.userId];
                    const base = existingEntry ? (existingEntry.ptsRaw || 0) : 0;
                    const newPts = base + bonus;
                    // ★追加：エクストラワード正解の印を引き継ぐ
                    const wasExtra = existingEntry && existingEntry.ptsDisplay && existingEntry.ptsDisplay.includes("(ワード正解)");
                    const extraMark = wasExtra ? "(ワード正解)" : "";
                    const newDisplay = base > 0 ? `${base}pt (+${bonus}pt)${extraMark}` : `0pt`;
                    // ★追加：既存エントリのmode（称号集計用）を引き継ぐ
                    const inheritedMode = (existingEntry && existingEntry.mode) || getCurrentModeLabel();
                    set(ref(db, `game/history/${quizInfo.round}/${target.userId}`), { ptsDisplay: newDisplay, ptsRaw: newPts, rank: rankNum, mode: inheritedMode });
                }
            }
        }
        
        // すべての順位のポイント処理が終わったらフラグを立てる
        if (isAdmin) {
            window.is1stPointAwarded = true;
        }
    }

    // ★追加：最終結果発表（全員のスコアを集計し、下位から順にゆっくり発表する）
    // ★追加：チャット・リアクション・履歴データから特別称号を集計する（最終結果発表時に一度だけ実行）
    async function computeTitles(users) {
        const titles = [];
        const nameOf = (id) => { const u = users.find(x => x.id === id); return u ? u.name : null; };

        const [chatSnap, reactionSnap, historySnap] = await Promise.all([
            get(ref(db, 'game/chats')),
            get(ref(db, 'game/reactions')),
            get(ref(db, 'game/history'))
        ]);

        // --- 発言王・おしい賞・パス回数・寡黙賞：チャット全体を集計 ---
        const chatCounts = {}, nearCounts = {}, passCounts = {};
        if (chatSnap.exists()) {
            chatSnap.forEach(c => {
                const d = c.val();
                if (!d || !d.userId) return;
                chatCounts[d.userId] = (chatCounts[d.userId] || 0) + 1;
                if (d.isNear) nearCounts[d.userId] = (nearCounts[d.userId] || 0) + 1;
                if (d.isPass) passCounts[d.userId] = (passCounts[d.userId] || 0) + 1;
            });
        }
        const topChat = Object.entries(chatCounts).sort((a, b) => b[1] - a[1])[0];
        if (topChat && topChat[1] > 0) {
            const name = nameOf(topChat[0]);
            if (name) titles.push({ emoji: '🗣️', label: '発言王', name, detail: `${topChat[1]}回発言` });
        }
        const topNear = Object.entries(nearCounts).sort((a, b) => b[1] - a[1])[0];
        if (topNear && topNear[1] > 0) {
            const name = nameOf(topNear[0]);
            if (name) titles.push({ emoji: '😭', label: 'おしい賞', name, detail: `${topNear[1]}回おしい判定` });
        }
        const topPass = Object.entries(passCounts).sort((a, b) => b[1] - a[1])[0];
        if (topPass && topPass[1] > 0) {
            const name = nameOf(topPass[0]);
            if (name) titles.push({ emoji: '💤', label: 'マイペース賞', name, detail: `${topPass[1]}回パス` });
        }

        // --- リアクション関連（全体王＋絵文字別） ---
        const reactionCounts = {};
        const reactionByEmoji = {}; // emoji -> { uid: count }
        if (reactionSnap.exists()) {
            reactionSnap.forEach(c => {
                const d = c.val();
                if (!d || !d.userId || !d.emoji) return;
                reactionCounts[d.userId] = (reactionCounts[d.userId] || 0) + 1;
                if (!reactionByEmoji[d.emoji]) reactionByEmoji[d.emoji] = {};
                reactionByEmoji[d.emoji][d.userId] = (reactionByEmoji[d.emoji][d.userId] || 0) + 1;
            });
        }
        const topReaction = Object.entries(reactionCounts).sort((a, b) => b[1] - a[1])[0];
        if (topReaction && topReaction[1] > 0) {
            const name = nameOf(topReaction[0]);
            if (name) titles.push({ emoji: '🎉', label: 'リアクション王', name, detail: `${topReaction[1]}回リアクション` });
        }
        // ★追加：絵文字別の「一番よく送った人」称号
        const emojiTitleMap = {
            '🔥': { label: '紅蓮の魂', unit: '回🔥' },
            '👏': { label: '応援団長', unit: '回👏' },
            '💩': { label: '悪戯っ子賞', unit: '回💩' },
            '🥺': { label: '甘えん坊賞', unit: '回🥺' },
            '😡': { label: '激おこ賞', unit: '回😡' },
            '🤪': { label: 'お祭り騒ぎ賞', unit: '回🤪' }
        };
        Object.entries(emojiTitleMap).forEach(([emoji, info]) => {
            const counts = reactionByEmoji[emoji];
            if (!counts) return;
            const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
            if (top && top[1] > 0) {
                const name = nameOf(top[0]);
                if (name) titles.push({ emoji, label: info.label, name, detail: `${top[1]}${info.unit}` });
            }
        });

        // --- 履歴データから各種称号を集計 ---
        const historyByRound = {};
        if (historySnap.exists()) {
            historySnap.forEach(rSnap => { historyByRound[Number(rSnap.key)] = rSnap.val() || {}; });
        }
        const roundNums = Object.keys(historyByRound).map(Number).sort((a, b) => a - b);

        const perUser = {}; // uid -> { rounds:[], firstCount, extraCount, allHit, totalPts, maxSingle, modePts:{} }
        roundNums.forEach(rNum => {
            const roundData = historyByRound[rNum];
            Object.keys(roundData).forEach(uid => {
                const entry = roundData[uid];
                if (!perUser[uid]) perUser[uid] = { rounds: [], firstCount: 0, extraCount: 0, allHit: true, totalPts: 0, maxSingle: 0, modePts: {} };
                const pts = entry.ptsRaw || 0;
                perUser[uid].rounds.push(rNum);
                perUser[uid].totalPts += pts;
                if (pts > perUser[uid].maxSingle) perUser[uid].maxSingle = pts;
                if (entry.rank === 1) perUser[uid].firstCount++;
                if (entry.ptsDisplay && entry.ptsDisplay.includes('(ワード正解)')) perUser[uid].extraCount++;
                if (!pts || pts <= 0) perUser[uid].allHit = false;
                const mode = entry.mode || 'unknown';
                perUser[uid].modePts[mode] = (perUser[uid].modePts[mode] || 0) + pts;
            });
        });

        // 早押し王：早解き1位の獲得数が一番多い人
        let best1st = null;
        Object.entries(perUser).forEach(([uid, d]) => { if (!best1st || d.firstCount > best1st[1]) best1st = [uid, d.firstCount]; });
        if (best1st && best1st[1] > 0) {
            const name = nameOf(best1st[0]);
            if (name) titles.push({ emoji: '👑', label: '早押し王', name, detail: `早解き1位 ${best1st[1]}回` });
        }

        // エクストラハンター：エクストラワード正解数が一番多い人
        let bestExtra = null;
        Object.entries(perUser).forEach(([uid, d]) => { if (!bestExtra || d.extraCount > bestExtra[1]) bestExtra = [uid, d.extraCount]; });
        if (bestExtra && bestExtra[1] > 0) {
            const name = nameOf(bestExtra[0]);
            if (name) titles.push({ emoji: '🎭', label: 'エクストラハンター', name, detail: `エクストラワード正解 ${bestExtra[1]}回` });
        }

        // パーフェクト賞：参加した全ラウンドで得点し続けた人（3問以上参加が条件）
        const perfectCandidates = Object.entries(perUser)
            .filter(([, d]) => d.allHit && d.rounds.length >= 3)
            .sort((a, b) => b[1].rounds.length - a[1].rounds.length);
        if (perfectCandidates.length > 0) {
            const [uid, d] = perfectCandidates[0];
            const name = nameOf(uid);
            if (name) titles.push({ emoji: '🎯', label: 'パーフェクト賞', name, detail: `${d.rounds.length}問全問正解` });
        }

        // 皆勤賞：全ラウンドに参加した人（複数いる場合は得点が高い方）
        if (roundNums.length > 0) {
            const kaikinCandidates = Object.entries(perUser)
                .filter(([, d]) => d.rounds.length === roundNums.length)
                .sort((a, b) => b[1].totalPts - a[1].totalPts);
            if (kaikinCandidates.length > 0) {
                const [uid] = kaikinCandidates[0];
                const name = nameOf(uid);
                if (name) titles.push({ emoji: '🌙', label: '皆勤賞', name, detail: `全${roundNums.length}問参加` });
            }
        }

        // 追い上げ王：序盤を過ぎてから参加したのに、1問あたりの得点効率が一番高かった人
        if (roundNums.length >= 4) {
            const midPoint = roundNums[Math.floor(roundNums.length / 3)];
            const lateJoiners = Object.entries(perUser)
                .filter(([, d]) => d.rounds.length >= 3 && Math.min(...d.rounds) > midPoint)
                .map(([uid, d]) => [uid, d.totalPts / d.rounds.length])
                .sort((a, b) => b[1] - a[1]);
            if (lateJoiners.length > 0) {
                const [uid] = lateJoiners[0];
                const name = nameOf(uid);
                if (name) titles.push({ emoji: '🚀', label: '追い上げ王', name, detail: `途中参加から好成績` });
            }
        }

        // ★追加：得点効率王：1問あたりの平均獲得ptが一番高い人（3問以上参加が条件）
        const efficiencyCandidates = Object.entries(perUser)
            .filter(([, d]) => d.rounds.length >= 3)
            .map(([uid, d]) => [uid, d.totalPts / d.rounds.length])
            .sort((a, b) => b[1] - a[1]);
        if (efficiencyCandidates.length > 0) {
            const [uid, avg] = efficiencyCandidates[0];
            const name = nameOf(uid);
            if (name) titles.push({ emoji: '💰', label: '得点効率王', name, detail: `平均${avg.toFixed(1)}pt/問` });
        }

        // ★追加：ジェットコースター賞：一問での最高獲得ptが一番高かった人
        const bestSingle = Object.entries(perUser)
            .map(([uid, d]) => [uid, d.maxSingle])
            .sort((a, b) => b[1] - a[1])[0];
        if (bestSingle && bestSingle[1] > 0) {
            const name = nameOf(bestSingle[0]);
            if (name) titles.push({ emoji: '🎢', label: 'ジェットコースター賞', name, detail: `1問最大${bestSingle[1]}pt` });
        }

        // ★追加：スタートダッシュ賞：第1問での獲得ptが一番高かった人
        if (roundNums.length > 0) {
            const firstRound = roundNums[0];
            const firstRoundData = historyByRound[firstRound] || {};
            const startDashCandidates = Object.entries(firstRoundData)
                .map(([uid, entry]) => [uid, entry.ptsRaw || 0])
                .sort((a, b) => b[1] - a[1]);
            if (startDashCandidates.length > 0 && startDashCandidates[0][1] > 0) {
                const name = nameOf(startDashCandidates[0][0]);
                if (name) titles.push({ emoji: '🐇', label: 'スタートダッシュ賞', name, detail: `第${firstRound}問で${startDashCandidates[0][1]}pt` });
            }
        }

        // ★追加：のんびり賞：たくさん参加したのに平均得点が低めだった人（参加を楽しんでくれた賞、5問以上参加が条件）
        const nonbiriCandidates = Object.entries(perUser)
            .filter(([, d]) => d.rounds.length >= 5)
            .map(([uid, d]) => [uid, d.totalPts / d.rounds.length])
            .sort((a, b) => a[1] - b[1]);
        if (nonbiriCandidates.length > 0) {
            const name = nameOf(nonbiriCandidates[0][0]);
            if (name) titles.push({ emoji: '🐌', label: 'のんびり賞', name, detail: `${perUser[nonbiriCandidates[0][0]].rounds.length}問参加` });
        }

        // ★追加：寡黙賞：たくさん正解しているのにチャット数が少ない人（3問以上参加が条件）
        const mutedCandidates = Object.entries(perUser)
            .filter(([uid, d]) => d.rounds.length >= 3)
            .map(([uid, d]) => [uid, (chatCounts[uid] || 0) / d.rounds.length])
            .sort((a, b) => a[1] - b[1]);
        if (mutedCandidates.length > 0) {
            const name = nameOf(mutedCandidates[0][0]);
            if (name) titles.push({ emoji: '🤐', label: '寡黙な実力者賞', name, detail: `静かに好成績` });
        }

        // ★追加：モード別称号（そのモードで一番得点した人。該当データがある場合のみ）
        const modeTitleMap = {
            'choice_quiz': { emoji: '🎮', label: '選択肢クイズ王' },
            'choice_mosaic': { emoji: '🧩', label: '選択肢モザイク王' },
            'mosaic': { emoji: '🌫️', label: 'モザイク王' },
            'quiz': { emoji: '📝', label: '通常クイズ王' },
            'intro': { emoji: '🎵', label: 'イントロ職人' }
        };
        Object.entries(modeTitleMap).forEach(([modeKey, info]) => {
            const candidates = Object.entries(perUser)
                .map(([uid, d]) => [uid, d.modePts[modeKey] || 0])
                .filter(([, pts]) => pts > 0)
                .sort((a, b) => b[1] - a[1]);
            if (candidates.length > 0) {
                const name = nameOf(candidates[0][0]);
                if (name) titles.push({ emoji: info.emoji, label: info.label, name, detail: `${candidates[0][1]}pt獲得` });
            }
        });

        return titles;
    }

    async function renderFinalResults() {
        const usersSnap = await get(ref(db, 'game/users'));
        const panel = document.getElementById('final-results');
        const list = document.getElementById('final-rank-list');
        const titlesList = document.getElementById('final-titles-list');
        list.innerHTML = "";
        titlesList.innerHTML = "";
        panel.style.display = "block";
        panel.classList.remove('champion-glow-active');

        if (!usersSnap.exists()) { list.innerHTML = "<div>参加者がいません</div>"; return; }

        const users = [];
        usersSnap.forEach(c => { const u = c.val(); if (u && u.name && !u.isAdmin) users.push(u); });
        if (users.length === 0) { list.innerHTML = "<div>参加者がいません</div>"; return; }

        users.sort((a, b) => (b.score || 0) - (a.score || 0));

        // ★修正：先に特別称号を集計して1つずつ表示する
        try {
            const titles = await computeTitles(users);
            if (titles.length > 0) {
                const header = document.createElement('div');
                header.style.cssText = "text-align:center; color:#aaa; font-size:0.85rem; margin-bottom:6px; padding-bottom:8px; border-bottom:1px solid #333;";
                header.innerText = "🎖️ 特別賞 🎖️";
                titlesList.appendChild(header);

                for (const t of titles) {
                    await new Promise(r => setTimeout(r, 400));
                    const div = document.createElement('div');
                    div.className = 'final-title-item';
                    div.innerHTML = `<span>${t.emoji} <span class="title-label">${t.label}</span>：${t.name}</span><span class="title-detail">${t.detail}</span>`;
                    titlesList.appendChild(div);
                    requestAnimationFrame(() => div.classList.add('show'));
                }
            }
        } catch (e) {
            console.error("称号集計エラー:", e);
        }

        // ★修正：称号発表が終わったら、続けて順位発表に入る
        await new Promise(r => setTimeout(r, 800));

        const topN = users.slice(0, 5); // 上位5人まで発表

        const elements = [];
        topN.forEach((u, idx) => {
            const div = document.createElement('div');
            let rankClass = '';
            let badge = `${idx + 1}位`;
            if (idx === 0) { rankClass = 'is-champion'; badge = '🏆 優勝'; }
            else if (idx === 1) { badge = '🥈 2位'; }
            else if (idx === 2) { badge = '🥉 3位'; }
            div.className = `final-rank-item ${rankClass}`;
            div.innerHTML = `<span>${badge} ${u.name}</span><span>${u.score || 0}pt</span>`;
            list.appendChild(div);
            elements.push({ el: div, rankIndex: idx });
        });

        // 下位から1位に向かって逆順に、ゆっくりめに発表していく
        for (let i = elements.length - 1; i >= 0; i--) {
            const target = elements[i];
            let delay = 900;
            if (target.rankIndex === 0) delay = 3200;
            else if (target.rankIndex === 1) delay = 2200;
            else if (target.rankIndex === 2) delay = 1600;

            await new Promise(r => setTimeout(r, delay));
            target.el.classList.add('show');

            // ★1位発表の瞬間は、通常より豪華な演出にする
            if (target.rankIndex === 0) {
                panel.classList.add('champion-glow-active');
                if (typeof triggerConfetti === 'function') {
                    triggerConfetti();
                    setTimeout(() => triggerConfetti(), 400);
                    setTimeout(() => triggerConfetti(), 800);
                }
            }
        }
    }

    /**

    window.exitGame = async () => {

        try {
            // ★音声配信中/接続中なら先に後片付けする

                try { await onDisconnect(userRef).cancel(); } catch (e) {}

    // ================================================================
    // ★新機能：主催者マイク音声のリアルタイム配信（WebRTC）
    // Firebaseは接続情報（SDP/ICE）のやり取りにのみ使用し、音声データ自体は
    // 主催者と参加者のブラウザ間で直接（P2P）やり取りするため通信量・遅延を抑える
    // ================================================================
    const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let isVoiceBroadcasting = false;
    let hostMicStream = null;
    let hostPeerConnections = {}; // { participantId: RTCPeerConnection }
    let hostConnectedParticipants = new Set(); // 既に接続済み/接続処理中の参加者ID
    let participantPeerConnection = null; // 参加者側の1本だけの接続
    let voiceAudioContext = null; // ★追加：音量ブースト用のWeb Audio APIコンテキスト
    let voiceGainNode = null; // ★追加：音量ブースト用のGainNode

    // --- 主催者側：特定の参加者1人への接続を確立する ---
    async function hostConnectToParticipant(participantId) {
        if (!isVoiceBroadcasting || !hostMicStream) return;
        if (hostConnectedParticipants.has(participantId)) return;
        hostConnectedParticipants.add(participantId);

        try {
            const pc = new RTCPeerConnection(RTC_CONFIG);
            hostPeerConnections[participantId] = pc;

            // ★追加：接続状態をコンソールに出す（診断用）
            pc.oniceconnectionstatechange = () => console.log(`[Voice/Host→${participantId}] ICE状態:`, pc.iceConnectionState);
            pc.onconnectionstatechange = () => console.log(`[Voice/Host→${participantId}] 接続状態:`, pc.connectionState);

            hostMicStream.getTracks().forEach(track => pc.addTrack(track, hostMicStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `game/webrtc/ice/host/${participantId}`), event.candidate.toJSON());
                }
            };

            // 参加者からのICE candidateを受信（新規追加分だけ処理）
            onChildAdded(ref(db, `game/webrtc/ice/participant/${participantId}`), (snap) => {
                const candidate = snap.val();
                if (candidate && pc.signalingState !== 'closed') {
                    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
                }
            });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, `game/webrtc/offers/${participantId}`), { sdp: offer.sdp, type: offer.type });

            // 参加者からのanswerを待つ
            onValue(ref(db, `game/webrtc/answers/${participantId}`), (snap) => {
                const answer = snap.val();
                if (answer && pc.signalingState === 'have-local-offer') {
                    pc.setRemoteDescription(new RTCSessionDescription(answer)).catch(() => {});
                }
            });
        } catch (e) {
            console.error("音声接続エラー(主催者側):", e);
            hostConnectedParticipants.delete(participantId);
        }
    }

    // --- 主催者側：配信開始 ---
    async function startVoiceBroadcast() {
        try {
            hostMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            // ★追加：実際に使われているマイクの状態を確認（診断用）
            const track = hostMicStream.getAudioTracks()[0];
            if (track) {
                console.log('[Voice/主催者] マイクトラック:', track.label, ' enabled:', track.enabled, ' muted:', track.muted, ' readyState:', track.readyState);
            } else {
                console.log('[Voice/主催者] 警告：音声トラックが取得できていません');
            }
        } catch (e) {
            alert("マイクへのアクセスが許可されませんでした。");
            return;
        }
        isVoiceBroadcasting = true;
        document.getElementById('btn-voice-toggle').innerText = "🎤 音声配信停止";
        document.getElementById('btn-voice-toggle').style.background = "#e91e63";
        document.getElementById('voice-status').innerText = "配信中...";
        // ★追加：参加者側に配信中であることを伝えるフラグ
        await set(ref(db, 'game/webrtc/broadcasting'), true);

        // 現在オンラインの参加者全員に接続
        const usersSnap = await get(ref(db, 'game/users'));
        if (usersSnap.exists()) {
            usersSnap.forEach(child => {
                const u = child.val();
                if (u && u.id && u.id !== myId && u.isOnline) {
                    hostConnectToParticipant(u.id);
                }
            });
        }
    }

    // --- 主催者側：配信停止 ---
    async function stopVoiceBroadcast() {
        isVoiceBroadcasting = false;
        if (hostMicStream) {
            hostMicStream.getTracks().forEach(t => t.stop());
            hostMicStream = null;
        }
        Object.values(hostPeerConnections).forEach(pc => { try { pc.close(); } catch(e){} });
        hostPeerConnections = {};
        hostConnectedParticipants.clear();
        document.getElementById('btn-voice-toggle').innerText = "🎤 音声配信開始";
        document.getElementById('btn-voice-toggle').style.background = "#9c27b0";
        document.getElementById('voice-status').innerText = "";
        // ★追加：参加者側に配信終了を伝えてから、接続情報を掃除する
        try { await set(ref(db, 'game/webrtc/broadcasting'), false); } catch(e) {}
        try { await remove(ref(db, 'game/webrtc/offers')); } catch(e) {}
        try { await remove(ref(db, 'game/webrtc/answers')); } catch(e) {}
        try { await remove(ref(db, 'game/webrtc/ice')); } catch(e) {}
    }

    // --- 主催者側：配信中に新しく参加者がオンラインになったら自動接続 ---
    onValue(ref(db, 'game/users'), (snap) => {
        if (!isAdmin || !isVoiceBroadcasting) return;
        snap.forEach(child => {
            const u = child.val();
            if (u && u.id && u.id !== myId && u.isOnline) {
                hostConnectToParticipant(u.id);
            }
        });
    });

    // --- 参加者側：主催者からのoffer受信を待ち受け、応答する ---
    function listenForHostVoice() {
        if (!myId || isAdmin) return;

        // ★追加：主催者の配信状態フラグを監視し、停止したら表示・接続を確実にリセットする
        onValue(ref(db, 'game/webrtc/broadcasting'), (snap) => {
            const isLive = snap.val() === true;
            if (!isLive) {
                const statusEl = document.getElementById('voice-mic-status');
                const muteBtnEl = document.getElementById('voice-mute-btn');
                const enableBtnEl = document.getElementById('voice-enable-btn');
                const volSliderEl = document.getElementById('voice-volume-slider');
                const volValEl = document.getElementById('voice-volume-val');
                if (statusEl) statusEl.style.display = "none";
                if (muteBtnEl) muteBtnEl.style.display = "none";
                if (enableBtnEl) enableBtnEl.style.display = "none";
                if (volSliderEl) volSliderEl.style.display = "none";
                if (volValEl) volValEl.style.display = "none";
                if (participantPeerConnection) {
                    try { participantPeerConnection.close(); } catch (e) {}
                    participantPeerConnection = null;
                }
                const audioEl = document.getElementById('host-voice-audio');
                if (audioEl) audioEl.srcObject = null;
            }
        });

        onValue(ref(db, `game/webrtc/offers/${myId}`), async (snap) => {
            const offer = snap.val();
            console.log('[Voice/参加者] offer受信:', offer ? 'あり' : 'なし', ' 既存接続:', !!participantPeerConnection);
            if (!offer || participantPeerConnection) return; // 既に接続済みなら無視

            try {
                const pc = new RTCPeerConnection(RTC_CONFIG);
                participantPeerConnection = pc;

                // ★追加：接続状態をコンソールに出す（診断用）
                pc.oniceconnectionstatechange = () => console.log('[Voice/参加者] ICE状態:', pc.iceConnectionState);
                pc.onconnectionstatechange = () => console.log('[Voice/参加者] 接続状態:', pc.connectionState);

                pc.ontrack = (event) => {
                    // ★追加：受け取った音声トラックの状態を確認（診断用）
                    if (event.track) {
                        console.log('[Voice/参加者] トラック受信 kind:', event.track.kind, ' enabled:', event.track.enabled, ' muted:', event.track.muted, ' readyState:', event.track.readyState);
                    }
                    const audioEl = document.getElementById('host-voice-audio');
                    if (audioEl) {
                        audioEl.srcObject = event.streams[0];
                        audioEl.muted = true; // ★Web Audio経由で出力するので、element自体はミュートして二重再生を防ぐ
                        audioEl.play().catch(() => {});
                    }
                    // ★追加：Web Audio APIのGainNodeで音量を100%以上にブースト（マイクの入力音量が小さい場合の対策）
                    try {
                        if (!voiceAudioContext) voiceAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const source = voiceAudioContext.createMediaStreamSource(event.streams[0]);
                        voiceGainNode = voiceAudioContext.createGain();
                        // ★修正：ミュート中に再接続した場合は0のまま、そうでなければ音量スライダーの現在値を初期ゲインとして使う
                        const volSlider = document.getElementById('voice-volume-slider');
                        voiceGainNode.gain.value = isVoiceMuted ? 0 : (volSlider ? Number(volSlider.value) / 100 : 3.0);
                        source.connect(voiceGainNode).connect(voiceAudioContext.destination);
                        if (voiceAudioContext.state === 'suspended') {
                            const enableBtn = document.getElementById('voice-enable-btn');
                            if (enableBtn) enableBtn.style.display = "inline-block";
                        }
                    } catch (e) {
                        console.error('[Voice/参加者] 音量ブースト初期化エラー:', e);
                    }
                    // ★追加：音量スライダーを表示する
                    const volSliderEl = document.getElementById('voice-volume-slider');
                    const volValEl = document.getElementById('voice-volume-val');
                    if (volSliderEl) volSliderEl.style.display = "inline-block";
                    if (volValEl) volValEl.style.display = "inline";
                    const statusEl = document.getElementById('voice-mic-status');
                    const muteBtnEl = document.getElementById('voice-mute-btn');
                    if (statusEl) statusEl.style.display = "inline";
                    // ★修正：ボタンのアイコンも現在のミュート状態に合わせて表示する
                    if (muteBtnEl) { muteBtnEl.style.display = "inline"; muteBtnEl.innerText = isVoiceMuted ? "🔇" : "🔊"; }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        push(ref(db, `game/webrtc/ice/participant/${myId}`), event.candidate.toJSON());
                    }
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));

                // 主催者からのICE candidateを受信（新規追加分だけ処理）
                onChildAdded(ref(db, `game/webrtc/ice/host/${myId}`), (candSnap) => {
                    const candidate = candSnap.val();
                    if (candidate && pc.signalingState !== 'closed') {
                        pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
                    }
                });

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await set(ref(db, `game/webrtc/answers/${myId}`), { sdp: answer.sdp, type: answer.type });
            } catch (e) {
                console.error("音声接続エラー(参加者側):", e);
                participantPeerConnection = null;
            }
        });
    }

    // --- 参加者側：主催者音声のミュート切替 ---
    let isVoiceMuted = false;
    document.addEventListener('DOMContentLoaded', () => {
        const voiceMuteBtn = document.getElementById('voice-mute-btn');
        const voiceVolumeSlider = document.getElementById('voice-volume-slider');
        const voiceVolumeVal = document.getElementById('voice-volume-val');
        if (voiceMuteBtn) {
            voiceMuteBtn.onclick = () => {
                isVoiceMuted = !isVoiceMuted;
                // ★修正：音声はGainNode経由で出力しているので、GainNodeの音量を切り替える（解除時はスライダーの値に戻す）
                if (voiceGainNode) {
                    voiceGainNode.gain.value = isVoiceMuted ? 0 : (voiceVolumeSlider ? Number(voiceVolumeSlider.value) / 100 : 3.0);
                }
                voiceMuteBtn.innerText = isVoiceMuted ? "🔇" : "🔊";
            };
        }
        // ★追加：主催者音声の音量スライダー操作
        if (voiceVolumeSlider) {
            voiceVolumeSlider.oninput = () => {
                if (voiceVolumeVal) voiceVolumeVal.innerText = `${voiceVolumeSlider.value}%`;
                if (voiceGainNode && !isVoiceMuted) {
                    voiceGainNode.gain.value = Number(voiceVolumeSlider.value) / 100;
                }
            };
        }
        const voiceToggleBtn = document.getElementById('btn-voice-toggle');
        if (voiceToggleBtn) {
            voiceToggleBtn.onclick = () => {
                if (isVoiceBroadcasting) stopVoiceBroadcast();
                else startVoiceBroadcast();
            };
        }
        // ★追加：自動再生がブロックされた時の「有効にする」ボタン
        const voiceEnableBtn = document.getElementById('voice-enable-btn');
        if (voiceEnableBtn) {
            voiceEnableBtn.onclick = () => {
                const audioEl = document.getElementById('host-voice-audio');
                if (audioEl) audioEl.play().catch(() => {});
                if (voiceAudioContext && voiceAudioContext.state === 'suspended') {
                    voiceAudioContext.resume().then(() => {
                        voiceEnableBtn.style.display = "none";
                    }).catch(() => {});
                } else {
                    voiceEnableBtn.style.display = "none";
                }
            };
        }
    });

</script>
</body>
</html>
