<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>INTRO DON! - Deluxe Edition</title>
    <style>
        :root { --primary-color: #007bff; --admin-color: #ff4757; --bg-color: #0f0f0f; --gold: #ffd700; --my-name-color: #00d4ff; --success-green: #28a745; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; background: var(--bg-color); color: #fff; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        
        /* セットアップ画面 */
        #setup-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .setup-box { background: #fff; color: #333; padding: 40px; border-radius: 20px; text-align: center; width: 340px; max-width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        .btn-join { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .admin-login-link { cursor: pointer; color: #666; font-size: 13px; margin-top: 15px; text-decoration: underline; display: block; }

        /* 管理パネル */
        #admin-panel { background: #000; padding: 12px; display: none; border-bottom: 2px solid var(--admin-color); z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .admin-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .admin-btn { background: var(--admin-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        #reserve-area { flex: 1; height: 50px; background: #222; color: #0f0; border: 1px solid #444; border-radius: 4px; font-family: monospace; font-size: 11px; padding: 5px; }
        #admin-seekbar { flex: 1; min-width: 150px; cursor: pointer; }

        /* 問題追加モーダル */
        #q-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10001; align-items: center; justify-content: center; }
        .q-modal-box { background: #222; padding: 25px; border-radius: 15px; width: 400px; border: 1px solid var(--admin-color); }
        .q-modal-box h3 { margin-top: 0; color: var(--admin-color); }
        .q-input-group { margin-bottom: 15px; }
        .q-input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #aaa; }
        .q-input-group input, .q-input-group select { width: 100%; padding: 8px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .q-modal-btns { display: flex; gap: 10px; margin-top: 20px; }

        /* メインレイアウト */
        #main-game { display: none; flex: 1; overflow: hidden; }
        #video-section { flex: 7; position: relative; background: #000; display: flex; flex-direction: column; }
        
        #player-wrapper { flex: 1; position: relative; background: #000; overflow: hidden; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #click-guard { position: absolute; inset: 0; z-index: 15; background: transparent; }
        #video-cover { position: absolute; inset: 0; background: radial-gradient(circle, #222 0%, #000 100%); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

        /* ★追加：正解時などに画面中央に出る大きな通知（スマホでも折り返せるようクラス化） */
        .center-notify {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; z-index: 10000; background-color: rgba(0,0,0,0.8);
            padding: 20px; border-radius: 15px; white-space: nowrap;
            max-width: 90%; text-align: center; font-weight: bold;
        }

        /* 問題文表示エリア */
        #quiz-question-display {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 15px 30px; border-radius: 10px;
            border-left: 5px solid var(--primary-color); font-size: 1.8rem; font-weight: bold;
            color: #fff; z-index: 70; display: none; text-shadow: 2px 2px 4px #000;
            max-width: 70%; text-align: center;
        }

        /* クイズ専用15秒カウントダウン */
        #quiz-timer-display {
            position: absolute; bottom: 80px; right: 20px;
            background: rgba(255, 71, 87, 0.9); padding: 15px 20px; border-radius: 10px;
            font-size: 1.8rem; font-weight: bold; color: #fff; z-index: 51; display: none;
            min-width: 80px; text-align: center; box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        /* クイズ専用開始カウントダウン */
        #quiz-start-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 60; display: none; align-items: center; justify-content: center;
            font-size: 12rem; font-weight: bold; color: var(--gold); text-shadow: 0 0 30px var(--gold);
        }

        /* クイズタイトル隠し用オーバーレイ */
        #quiz-title-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #000;
            z-index: 42;
            display: none;
        }

        /* モザイククイズ用 */
        #mosaic-overlay {
            position: absolute; inset: 0; z-index: 39; display: none;
            backdrop-filter: blur(50px); pointer-events: none;
        }

        /* カウントダウン表示 */
        #countdown-container { display: none; position: relative; width: 250px; height: 250px; align-items: center; justify-content: center; }
        #countdown-circle { position: absolute; inset: 0; border: 6px solid rgba(255, 255, 255, 0.2); border-radius: 50%; }
        
        #countdown-line {
            position: absolute;
            inset: -3px;
            border: 6px solid transparent;
            border-top: 6px solid #fff;
            border-radius: 50%;
            z-index: 10;
        }

        #countdown-display { font-size: 10rem; font-weight: bold; color: #fff; z-index: 5; text-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #play-sec-preview { color: #fff; font-weight: bold; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* コメント関連 */
        #screen-chat-overlay { position: absolute; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
        .danmaku { position: absolute; white-space: nowrap; font-size: 2rem; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000; left: 100%; animation: scrollLeft 6s linear forwards; }
        @keyframes scrollLeft { from { left: 100%; } to { left: -150%; } }
        
        #fastest-ranking { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 80%; max-width: 500px; display: none; z-index: 100; 
            border: 2px solid var(--gold); background: rgba(0,0,0,0.95); 
            border-radius: 15px; padding: 20px; box-shadow: 0 0 50px rgba(255,215,0,0.3); 
        }

        .rank-item { opacity: 0; transform: translateY(20px); transition: all 0.4s ease; display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #333; font-size: 1.2rem; }
        .rank-item.show { opacity: 1; transform: translateY(0); }
        .rank-item.is-1st { color: var(--gold); font-weight: bold; font-size: 1.5rem; border-bottom: 2px solid var(--gold); }

        @keyframes winner-pulse { 0% { box-shadow: 0 0 10px var(--gold); } 50% { box-shadow: 0 0 40px var(--gold); } 100% { box-shadow: 0 0 10px var(--gold); } }
        .winner-anim { animation: winner-pulse 1s infinite; }

        /* ★追加：最終結果発表パネル（豪華め） */
        #final-results {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88%; max-width: 620px; max-height: 82vh; display: none; z-index: 110;
            border: 3px solid var(--gold); background: rgba(0,0,0,0.97);
            border-radius: 22px; padding: 30px; box-shadow: 0 0 80px rgba(255,215,0,0.4);
            overflow-y: auto;
        }
        .final-rank-item {
            opacity: 0; transform: translateY(30px) scale(0.9); transition: all 0.6s cubic-bezier(.34,1.56,.64,1);
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 18px; border-bottom: 1px solid #333; font-size: 1.3rem;
        }
        .final-rank-item.show { opacity: 1; transform: translateY(0) scale(1); }
        .final-rank-item.is-champion {
            color: var(--gold); font-weight: bold; font-size: 2.1rem;
            border-bottom: 3px solid var(--gold); text-shadow: 0 0 20px var(--gold);
            padding: 22px 18px;
        }
        @keyframes champion-glow {
            0% { box-shadow: 0 0 30px rgba(255,215,0,0.4); }
            50% { box-shadow: 0 0 100px rgba(255,215,0,0.9); }
            100% { box-shadow: 0 0 30px rgba(255,215,0,0.4); }
        }
        .champion-glow-active { animation: champion-glow 1.1s infinite; }

        /* ★追加：チャンスタイムボタンの虹色グラデーション常時点滅 */
        @keyframes chance-btn-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ★追加：チャンスタイム演出オーバーレイ */
        #chance-time-overlay {
            position: fixed; inset: 0; z-index: 200000; display: none;
            align-items: center; justify-content: center; overflow: hidden; pointer-events: none;
        }
        #ct-flash {
            position: absolute; inset: 0; background: #000; opacity: 0;
        }
        /* ★修正：暗転はフェードアウトせず「保持」する（この後TVオフ演出→フリーズの間、真っ黒を維持するため） */
        #ct-flash.play { opacity: 1; transition: opacity 0.08s ease-in; }

        /* ★追加：ブラウン管テレビの電源を切る時のような、白い線が縦→点に収縮する演出 */
        #ct-tvline {
            position: absolute; left: 0; top: 50%; width: 100%; height: 100%;
            background: #fff; opacity: 0;
            transform: translateY(-50%) scaleY(1) scaleX(1);
            box-shadow: 0 0 40px 10px rgba(255,255,255,0.8);
        }
        #ct-tvline.play { animation: ct-tv-off 0.55s cubic-bezier(.7,0,.84,0) forwards; }
        @keyframes ct-tv-off {
            0% { opacity: 1; transform: translateY(-50%) scaleY(1) scaleX(1); }
            55% { opacity: 1; transform: translateY(-50%) scaleY(0.006) scaleX(1); box-shadow: 0 0 60px 15px rgba(255,255,255,0.9); }
            80% { opacity: 1; transform: translateY(-50%) scaleY(0.006) scaleX(0.02); box-shadow: 0 0 20px 6px rgba(255,255,255,0.9); }
            100% { opacity: 0; transform: translateY(-50%) scaleY(0.001) scaleX(0.001); box-shadow: none; }
        }

        #ct-rays {
            position: absolute; width: 220vmax; height: 220vmax;
            background: conic-gradient(from 0deg, #ff0080, #ff8c00, #ffd700, #00e5ff, #7b2ff7, #ff0080);
            opacity: 0; transform: scale(0) rotate(0deg);
        }
        @keyframes ct-rays-anim {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            20% { opacity: 0.85; }
            100% { opacity: 0.85; transform: scale(1) rotate(340deg); }
        }
        #ct-rays.play { animation: ct-rays-anim 3.2s cubic-bezier(.2,.8,.3,1) forwards; }

        #ct-text { position: relative; text-align: center; opacity: 0; transform: scale(0.3); z-index: 2; }
        #ct-text.play { animation: ct-text-anim 1.1s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay: 0.5s; }
        @keyframes ct-text-anim {
            0% { opacity: 0; transform: scale(0.3) rotate(-8deg); }
            60% { opacity: 1; transform: scale(1.3) rotate(4deg); }
            80% { transform: scale(0.92) rotate(-2deg); }
            100% { opacity: 1; transform: scale(1.05) rotate(0deg); }
        }
        .ct-line1 {
            font-size: 4rem; font-weight: 900;
            background: linear-gradient(90deg, #ff0080, #ff8c00, #ffd700, #00e5ff, #7b2ff7, #ff0080);
            background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: ct-rainbow-text 1.5s linear infinite;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }
        @keyframes ct-rainbow-text {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .ct-line2 {
            font-size: 2.2rem; font-weight: bold; color: #fff; margin-top: 10px;
            text-shadow: 0 0 20px gold, 0 0 40px gold;
        }

        /* ★追加：2倍ラウンド中、映像エリアを金色に縁取って常時アピール */
        @keyframes double-border-glow {
            0% { box-shadow: 0 0 20px gold, inset 0 0 20px rgba(255,215,0,0.2); border-color: gold; }
            50% { box-shadow: 0 0 60px gold, inset 0 0 60px rgba(255,215,0,0.5); border-color: #fff59d; }
            100% { box-shadow: 0 0 20px gold, inset 0 0 20px rgba(255,215,0,0.2); border-color: gold; }
        }
        #video-section.double-round-active {
            border: 4px solid gold;
            animation: double-border-glow 1.6s infinite;
        }
        #double-round-badge {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(90deg, #ff0080, #ffd700, #ff0080);
            background-size: 200% 100%; animation: chance-btn-gradient 1.5s linear infinite;
            color: #000; font-weight: 900; padding: 6px 18px; border-radius: 20px;
            font-size: 0.95rem; z-index: 95; display: none; box-shadow: 0 0 20px gold;
        }

        /* ★追加：最終結果の特別称号 */
        .final-title-item {
            opacity: 0; transform: translateX(-20px); transition: all 0.5s ease;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; margin-top: 6px; border-radius: 10px;
            background: rgba(255,255,255,0.06); font-size: 0.95rem;
        }
        .final-title-item.show { opacity: 1; transform: translateX(0); }
        .final-title-item .title-label { color: var(--gold); font-weight: bold; }
        .final-title-item .title-detail { color: #aaa; font-size: 0.8rem; }

        /* ★追加：1位確定時の紙吹雪演出 */
        .confetti-piece {
            position: fixed; top: -20px; width: 8px; height: 14px; z-index: 100000; pointer-events: none;
            animation: confetti-fall linear forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ★追加：リアクション絵文字の演出（bottom%を動かすことでコンテナの高さに応じて画面上部近くまで伸びる） */
        .reaction-bubble {
            position: absolute; bottom: 5%; font-size: 2.8rem; z-index: 9999; pointer-events: none;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        /* 通常：まっすぐ上昇 */
        .reaction-bubble.rise { animation: reaction-rise 3s ease-out forwards; }
        @keyframes reaction-rise {
            0% { bottom: 5%; opacity: 0; transform: scale(0.5); }
            15% { opacity: 1; transform: scale(1.2); }
            100% { bottom: 92%; opacity: 0; transform: scale(1); }
        }
        /* 💩：上から降ってくる */
        .reaction-bubble.fall { top: -10%; bottom: auto; animation: reaction-fall 3s ease-in forwards; }
        @keyframes reaction-fall {
            0% { top: -10%; opacity: 0; transform: scale(0.5) rotate(0deg); }
            15% { opacity: 1; transform: scale(1.2) rotate(15deg); }
            100% { top: 95%; opacity: 0; transform: scale(1) rotate(-15deg); }
        }
        /* 😡：左右に震えながら上昇 */
        .reaction-bubble.shake { animation: reaction-shake 3s ease-out forwards; }
        @keyframes reaction-shake {
            0% { bottom: 5%; opacity: 0; transform: translateX(0) scale(0.5); }
            15% { opacity: 1; transform: translateX(-10px) scale(1.2); }
            30% { transform: translateX(10px) scale(1.1); }
            45% { transform: translateX(-10px) scale(1.1); }
            60% { transform: translateX(10px) scale(1.1); }
            75% { transform: translateX(-6px) scale(1.05); }
            100% { bottom: 92%; opacity: 0; transform: translateX(0) scale(1); }
        }
        /* 🤪👺：回転しながら上昇 */
        .reaction-bubble.spin { animation: reaction-spin 3s ease-out forwards; }
        @keyframes reaction-spin {
            0% { bottom: 5%; opacity: 0; transform: rotate(0deg) scale(0.5); }
            15% { opacity: 1; transform: rotate(90deg) scale(1.2); }
            100% { bottom: 92%; opacity: 0; transform: rotate(720deg) scale(1); }
        }
        /* 🥺：左右にゆらゆら揺れながら上昇 */
        .reaction-bubble.sway { animation: reaction-sway 3.2s ease-out forwards; }
        @keyframes reaction-sway {
            0% { bottom: 5%; opacity: 0; margin-left: 0; transform: scale(0.5); }
            15% { opacity: 1; transform: scale(1.1); }
            30% { margin-left: -18px; }
            50% { margin-left: 18px; }
            70% { margin-left: -18px; }
            100% { bottom: 92%; opacity: 0; margin-left: 0; transform: scale(1); }
        }
        /* 👍：ドンッと大きく弾んでから上昇 */
        .reaction-bubble.pop { animation: reaction-pop 3s ease-out forwards; }
        @keyframes reaction-pop {
            0% { bottom: 5%; opacity: 0; transform: scale(0.3); }
            20% { opacity: 1; transform: scale(1.7); }
            35% { transform: scale(1.1); }
            100% { bottom: 92%; opacity: 0; transform: scale(1.3); }
        }
        /* 🔥：メラメラ揺れながら上昇 */
        .reaction-bubble.flicker { animation: reaction-flicker 3s ease-out forwards; }
        @keyframes reaction-flicker {
            0% { bottom: 5%; opacity: 0; transform: scale(0.5) rotate(0deg); }
            10% { opacity: 1; transform: scale(1.3) rotate(-5deg); }
            20% { transform: scale(1.0) rotate(5deg); }
            30% { transform: scale(1.25) rotate(-4deg); }
            40% { transform: scale(1.05) rotate(4deg); }
            50% { transform: scale(1.2) rotate(-3deg); }
            100% { bottom: 92%; opacity: 0; transform: scale(1) rotate(0deg); }
        }
        /* 😭：しゃくり上げるように上下にバウンドしながら上昇 */
        .reaction-bubble.sob { animation: reaction-sob 3.2s ease-out forwards; }
        @keyframes reaction-sob {
            0% { bottom: 5%; opacity: 0; transform: translateY(0) scale(0.5); }
            12% { opacity: 1; transform: translateY(-10px) scale(1.15); }
            24% { transform: translateY(6px) scale(1.05); }
            36% { transform: translateY(-8px) scale(1.1); }
            48% { transform: translateY(5px) scale(1.05); }
            60% { transform: translateY(-6px) scale(1.08); }
            100% { bottom: 92%; opacity: 0; transform: translateY(0) scale(1); }
        }
        /* 👏：パチパチ左右に素早く傾きながら上昇 */
        .reaction-bubble.clap { animation: reaction-clap 2.6s ease-out forwards; }
        @keyframes reaction-clap {
            0% { bottom: 5%; opacity: 0; transform: rotate(0deg) scale(0.5); }
            10% { opacity: 1; transform: rotate(-25deg) scale(1.3); }
            20% { transform: rotate(25deg) scale(1.2); }
            30% { transform: rotate(-25deg) scale(1.2); }
            40% { transform: rotate(25deg) scale(1.15); }
            50% { transform: rotate(-20deg) scale(1.1); }
            60% { transform: rotate(20deg) scale(1.1); }
            70% { transform: rotate(-10deg) scale(1.05); }
            100% { bottom: 92%; opacity: 0; transform: rotate(0deg) scale(1); }
        }
        /* 🤔：ゆっくり首をかしげるように回転しながら上昇 */
        .reaction-bubble.tilt { animation: reaction-tilt 3.5s ease-in-out forwards; }
        @keyframes reaction-tilt {
            0% { bottom: 5%; opacity: 0; transform: rotate(0deg) scale(0.5); }
            15% { opacity: 1; transform: rotate(-12deg) scale(1.1); }
            40% { transform: rotate(10deg) scale(1.05); }
            65% { transform: rotate(-8deg) scale(1.05); }
            100% { bottom: 92%; opacity: 0; transform: rotate(0deg) scale(1); }
        }
        /* 💦：プルプル震えてから上昇（冷や汗っぽく） */
        .reaction-bubble.shiver { animation: reaction-shiver 3s ease-out forwards; }
        @keyframes reaction-shiver {
            0% { bottom: 5%; opacity: 0; transform: translateX(0) scale(0.5); }
            8% { opacity: 1; transform: translateX(-4px) scale(1.1); }
            16% { transform: translateX(4px) scale(1.1); }
            24% { transform: translateX(-4px) scale(1.1); }
            32% { transform: translateX(4px) scale(1.1); }
            40% { transform: translateX(-3px) scale(1.05); }
            48% { transform: translateX(3px) scale(1.05); }
            100% { bottom: 92%; opacity: 0; transform: translateX(0) scale(1); }
        }

        /* ★修正：リアクションバーを映像エリアの右端に縦並びで配置 */
        #reaction-bar {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 6px; z-index: 90;
        }
        .reaction-btn { background: rgba(0,0,0,0.5); border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
        .reaction-btn:hover { background: rgba(0,0,0,0.8); }
        #sidebar { flex: 2; background: #1a1a1a; border-left: 1px solid #333; display: flex; flex-direction: column; min-width: 250px; }
        #user-list { flex: 1; padding: 10px; overflow-y: auto; }
        .user-card { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
        .user-card.is-me { border: 2px solid var(--my-name-color); background: #1a3a4a; }
        .user-card.is-admin { border: 2px solid var(--admin-color); background: #3a1a1a; }
        
        .crown { color: var(--gold); margin-right: 4px; }
        .correct-mark { background: var(--success-green); color: white; font-size: 10px; padding: 2px 5px; border-radius: 4px; margin-left: 5px; }

        #input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; border-top: 1px solid #333; align-items: center; z-index: 70; position: relative; flex-shrink: 0; }
        #answer-input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 2px solid #444; background: #333; color: #fff; outline: none; }
        #result-notice { position: absolute; top: -30px; left: 20px; font-weight: bold; display: none; z-index: 80; }
        
        .volume-controls { display: flex; align-items: center; gap: 8px; min-width: 140px; }
        #volume-slider { accent-color: var(--primary-color); width: 80px; cursor: pointer; }

        /* ★追加：スマホ・タブレット用のランキング開閉トグルボタン（PCでは非表示） */
        #sidebar-toggle-btn { display: none; }
        #sidebar-overlay { display: none; }

        /* ================================================================
           ★追加：スマホ・タブレット向けレスポンシブレイアウト
           画面幅が820px以下（縦向き・横向きどちらも対象）で発動する
           ================================================================ */
        @media (max-width: 820px) {
            #main-game { flex-direction: column; }
            #video-section { flex: 1; height: auto; min-height: 0; }

            /* サイドバー（ランキング）は普段は右から隠れており、ボタンでスライド表示 */
            #sidebar {
                position: fixed; top: 0; right: 0; height: 100%; width: 78vw; max-width: 320px;
                min-width: 0; z-index: 250; transform: translateX(100%);
                transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
                box-shadow: -4px 0 20px rgba(0,0,0,0.6);
            }
            #sidebar.mobile-open { transform: translateX(0); }
            #sidebar-overlay {
                display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                z-index: 240; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            }
            #sidebar-overlay.show { opacity: 1; pointer-events: auto; }

            #sidebar-toggle-btn {
                display: block; position: fixed; top: 10px; right: 10px; z-index: 260000;
                background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 50%;
                width: 42px; height: 42px; font-size: 20px; cursor: pointer;
            }

            /* ★修正：常時flowに置くと高さが足りず画面外にはみ出すため、動画の上に浮かせる形に戻し、位置とサイズだけ調整 */
            #reaction-bar {
                position: absolute; top: auto; bottom: 8px; left: 6px; right: 6px; transform: none;
                flex-direction: row; flex-wrap: wrap;
                justify-content: center; gap: 4px; padding: 5px; background: rgba(0,0,0,0.35);
                border-radius: 10px; z-index: 90;
            }
            .reaction-btn { width: 28px; height: 28px; font-size: 13px; }

            /* 入力欄まわりのボタン群は折り返して、はみ出さないようにする */
            #input-area { flex-wrap: wrap; padding: 10px; gap: 6px; justify-content: center; }
            #answer-input { flex: 1 1 100%; order: -1; margin-bottom: 6px; }
            #input-area button, #input-area .volume-controls { font-size: 13px; padding: 8px 10px !important; }

            /* 主催者パネルは元々PC想定の横並びボタン群なので、はみ出さないよう折り返しのみ許可 */
            #admin-panel { flex-wrap: wrap; }

            /* ★追加：入場画面（名前入力・参加ボタン）をスマホでも見やすく・押しやすく */
            .setup-box { width: 92vw; padding: 30px 24px; border-radius: 16px; }
            .setup-box h2 { font-size: 1.3rem; }
            #user-name { font-size: 16px !important; padding: 14px !important; } /* 16px以上でiOSの自動ズームを防止 */
            .btn-join { font-size: 16px; padding: 15px !important; border-radius: 10px; }
            .admin-login-link { font-size: 15px; margin-top: 20px; }
            #admin-close-lock { font-size: 12px !important; padding: 8px !important; }

            /* ★追加：クイズの問題文が崩れないよう縮小 */
            #quiz-question-display {
                font-size: 1.05rem; padding: 10px 16px; max-width: 90%;
                bottom: 12px; line-height: 1.4;
            }

            /* ★追加：カウントダウン演出をスマホの狭い映像エリアに収まるよう縮小 */
            #countdown-container { width: 140px; height: 140px; }
            #countdown-display { font-size: 4.2rem; }
            #ready-text { font-size: 1.6rem !important; letter-spacing: 3px !important; }

            /* ★追加：チャンスタイム演出の文字がはみ出さないよう縮小 */
            .ct-line1 { font-size: 2rem; letter-spacing: 1px; }
            .ct-line2 { font-size: 1.2rem; }

            /* ★追加：正解時の中央通知（正解！○○ptなど）が画面からはみ出さないよう折り返し・縮小 */
            .center-notify {
                font-size: 1.5rem; white-space: normal; padding: 14px 18px; max-width: 85%;
            }
        }

        /* ★追加：スマホ横向き（landscape）専用の調整。縦の高さが少ないので、リアクションは右端に縦の帯として戻す */
        @media (max-width: 820px) and (orientation: landscape) {
            #reaction-bar {
                top: 50%; bottom: auto; left: auto; right: 6px; transform: translateY(-50%);
                flex-direction: column; flex-wrap: nowrap;
                max-height: 92%; overflow-y: auto;
                width: auto; padding: 4px; border-radius: 10px;
            }
            .reaction-btn { width: 26px; height: 26px; font-size: 12px; }

            /* ★追加：縦の高さが少ないので、入力欄のボタン群は折り返さず横スクロールにする（見切れ防止） */
            #input-area {
                flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
                justify-content: flex-start; padding: 6px 10px;
            }
            #answer-input { flex: 0 0 130px; order: 0; margin-bottom: 0; }
            #input-area button { flex-shrink: 0; font-size: 12px !important; padding: 6px 10px !important; }
            #input-area .volume-controls { flex-shrink: 0; min-width: 110px; }
        }

        /* 管理者以外にはエラーメッセージを非表示 */
        body:not(.is-admin-mode) #error-message { display: none !important; }
        /* 選択肢ボタンの見た目 */
        /* 1. ボタンを包むコンテナ（2列に並べるための親） */
        #choice-container {
            display: flex;
            flex-wrap: wrap;      /* 折り返しを許可 */
            gap: 10px;            /* ボタン同士の隙間 */
            justify-content: center;
            width: 100%;
            max-width: 600px;     /* お好みの横幅に調整してください */
            margin: 15px auto;    /* 中央寄せ */
        }

        /* 2. 選択肢ボタン本体 */
        .choice-btn {
            /* --- 横並びの設定 --- */
            flex: 1 1 calc(50% - 10px); /* 幅を半分（50%）に設定。隙間分を引く */
            box-sizing: border-box;
    
            /* --- 見た目の設定（あなたのコードをベースにしています） --- */
            padding: 15px 10px; /* 上下15px, 左右10px */
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid var(--primary-color, #fff);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 1px 1px 2px black;
        }

        .choice-btn:hover:not(:disabled) {
            background: var(--primary-color, #444);
            transform: scale(1.02);
        }

        .choice-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
}
    </style>
</head>
<body>

        <div id="ban-list-display" style="padding:0 15px 15px 15px; font-size:10px; color:#ff4d4d;"></div>
    </div>
</div>

<!-- ★追加：チャンスタイム演出用オーバーレイ -->
<div id="chance-time-overlay">
    <div id="ct-flash"></div>
    <div id="ct-tvline"></div>
    <div id="ct-rays"></div>
    <div id="ct-text">
        <div class="ct-line1">🎰 CHANCE TIME!! 🎰</div>
        <div class="ct-line2">ポイント2倍発生！！</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, onChildAdded, push, remove, update, increment, query, limitToLast, onDisconnect, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInAnonymously, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAWAEgirPeXoqn6b9YATepoudYfN9NGWB8",
        authDomain: "intro-don-game.firebaseapp.com",
        databaseURL: "https://intro-don-game-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "intro-don-game",
        storageBucket: "intro-don-game.firebasestorage.app",
        messagingSenderId: "398946245708",
        appId: "1:398946245708:web:97cf5bf7b601765c3d68e9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    // ★追加：主催者ログイン専用の固定メールアドレス（Firebaseコンソールで作成したアカウントに対応させる）
    const ADMIN_AUTH_EMAIL = "introdon-admin@introdon-quiz.com";
    const pageJoinTime = Date.now();
    let player, myName = "", myId = "", isAdmin = false;
    let quizInfo = { title: "", artist: "", round: 0, isQuizMode: false, isMosaicMode: false, questionText: "", startTimeOffset: 0, volumeRatio: 1.0 };
    let hasPointedTitle = false, hasPointedArtist = false, isRevealedGlobal = false;
    let roundPointsEarned = 0;
    let lastVolume = 50, isMuted = false, currentRankingVisible = false, currentFinalResultsVisible = false;
    let blindModeActive = false; // ★追加：ブラインドモード中はスコア・順位を隠す
    let lastVideoId = ""; 
    let isFirstPlayOfRound = true;

    const prepareJoin = async (role) => {
        try {
            const input = document.getElementById('user-name');
            let rawInput = input.value.trim();
            // HTMLやスクリプト記号を完全に無効化します
            let baseName = rawInput
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
            if(!baseName) return alert("名前を入力してください");
            if(role === 'admin') {
                // ★修正：Firebase Authで既にログイン済みのuidをそのままIDとして使う
                if (!auth.currentUser) { alert("認証エラー: もう一度ログインしてください"); return; }
                myId = auth.currentUser.uid;
                myName = baseName;
            } 
            else {
                // ★修正：匿名ログインしてFirebaseの本物のuidをIDとして使う（Firebase側が永続化してくれるので同じ端末なら次回も同じID）
                const cred = await signInAnonymously(auth);
                myId = cred.user.uid;
                const usersSnap = await get(ref(db, 'game/users'));
                let finalName = baseName;
                if(usersSnap.exists()){
                    const users = usersSnap.val();
                    let count = 0;
                    Object.values(users).forEach(u => { if(u && u.id !== myId && (u.name === baseName || (u.name && u.name.startsWith(baseName + "#")))) count++; });
                    if(count > 0) finalName = `${baseName}#${count}`;
                }
                myName = finalName;
            }
            await joinGame(role);
        } catch (e) { console.error(e); alert("ログインエラー"); }
    };

    async function joinGame(role) {
        isAdmin = (role === 'admin');
        if(isAdmin) document.body.classList.add('is-admin-mode');
        // ★修正：myIdは既にFirebase Authのuidで確定しているため、古いlocalStorageベースのID上書き処理は撤去

        const userRef = ref(db, `game/users/${myId}`);
        const snap = await get(userRef);
        const userData = snap.val();

        if (!userData || userData.score === undefined) {
            // 新規ユーザー：スコア0で作成
            await set(userRef, { 
                id: myId, 
                name: myName, 
                isAdmin, 
                score: 0, 
                joinedAt: serverTimestamp(), 
                lastSeen: serverTimestamp(), 
                isOnline: true 
            });
        } else {
            // 既存ユーザー：スコアを触らず名前と状態だけ更新
            await update(userRef, { 
                name: myName, 
                isAdmin, 
                lastSeen: serverTimestamp(), 
                isOnline: true 
            });
        }
        // 【ここまで追加・修正】
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-game').style.display = 'flex';
        if(isAdmin) document.getElementById('admin-panel').style.display = 'block';
        onDisconnect(userRef).update({ isOnline: false, lastSeen: serverTimestamp() });
        setInterval(() => { if(myId) update(ref(db, `game/users/${myId}`), { lastSeen: serverTimestamp(), isOnline: true }); }, 30000);
        initYouTube();
        // ★追加：参加者なら、主催者の音声配信の待ち受けを開始する
        if (!isAdmin && typeof listenForHostVoice === 'function') listenForHostVoice();
    }

// --- YouTube API 初期化 (Firefox安定版) ---
function initYouTube() {
    // 既存のスクリプトがあるかチェック
    const existingTag = document.querySelector('script[src*="iframe_api"]');
    if (!existingTag) {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api"; // 元に戻す
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } else if (window.YT && window.YT.Player) {
        onYouTubeIframeAPIReady();
    }
}

window.onYouTubeIframeAPIReady = () => {
        if (player) return;

        // 過去の成功例に基づいた、厳密なorigin生成
        let origin = window.location.protocol + '//' + window.location.hostname;
        if (window.location.port) origin += ':' + window.location.port;

        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            videoId: 'dQw4w9WgXcQ', // 初期動画ID
            host: 'https://www.youtube.com', // 成功例と同じ標準ドメイン
            playerVars: { 
                'controls': 0,
                'disablekb': 1,
                'rel': 0,
                'autoplay': 1,
                'mute': 1,
                'origin': origin,
                'enablejsapi': 1,
                'widget_referrer': origin,
                'playsinline': 1,
                'cc_load_policy': 0, // ★追加：字幕を自動でONにしない
                // 不要なパラメータ（iv_load_policy等）を一切排除し、
                // Firefoxのトラッキング防止に引っかからない「最小構成」にする
            },
            events: { 
                'onReady': (event) => {
                    // --- 属性の追加 ---
                    const iframe = event.target.getIframe();
                    if (iframe) {
                        // ブラウザに自動再生と暗号化メディアの許可を明示的に伝える
                        iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
                    }
                    // ★追加：視聴者のアカウント設定で字幕が強制表示される場合への保険
                    try { event.target.unloadModule('captions'); } catch (e) {}
                    // --- 既存の処理 ---
                    if (typeof listenToSignals === 'function') listenToSignals();
                },
                'onStateChange': (e) => {
                    // ★新設：このユーザーが画面でミュート中なら、動画の状態が変わった瞬間に音量を0に固定（次の曲での音漏れを完全にガード）
                    if (typeof isMuted !== 'undefined' && isMuted && e.target && e.target.setVolume) {
                        e.target.setVolume(0);
                    }
                    if (typeof onPlayerStateChange === 'function') onPlayerStateChange(e);
                },
                'onError': (e) => {
                    const errEl = document.getElementById('error-message');
                    if (errEl) errEl.style.display = "block";
                    window.isCurrentVideoError = true;
                }
            }
        });
    };
    // --- 修正：ここまで ---

    const updateVolumeUI = (val) => {
        const ratio = quizInfo.volumeRatio || 1.0;
        const finalVolume = Math.min(100, Math.floor(val * ratio));
        document.getElementById('volume-val').innerText = val;
        
        // ★修正：音量バーの値によってミュート状態フラグを厳密に切り替える
        if (val > 0) {
            if (player?.unMute) player.unMute();
            isMuted = false; // 0より大きければミュート解除
        } else {
            if (player?.mute) player.mute();
            isMuted = true;  // 0にされたら自動的にミュート状態（isMuted = true）にする
        }
        
        if(player?.setVolume) player.setVolume(finalVolume);
        document.getElementById('mute-btn').innerText = val == 0 ? "🔇" : "🔈";
    };

    const toggleMute = () => {
        const slider = document.getElementById('volume-slider');
        if(!isMuted) { 
            lastVolume = slider.value; 
            isMuted = true; 
            updateVolumeUI(0); 
            slider.value = 0; 
            if(player && player.setVolume) player.setVolume(0); // ★手動ミュート時、物理的にも音量を0にして音漏れを完全に遮断
        } 
        else { 
            isMuted = false; 
            const restoreVol = lastVolume > 0 ? lastVolume : 50;
            updateVolumeUI(restoreVol); 
            slider.value = restoreVol; 
            if(player && player.setVolume) {
                const ratio = (typeof quizInfo !== 'undefined' && quizInfo.volumeRatio) || 1.0;
                player.setVolume(Math.min(100, Math.floor(restoreVol * ratio))); // ★ミュート解除時、元の音量に復元
            }
        }
    };

    function listenToSignals() {
        if (window.__signals_initialized) return;
        window.__signals_initialized = true;
        // --- 修正箇所ここから ---
        // 全画面ボタンの動作設定
        const fsBtn = document.getElementById('fullscreen-btn');
        if (fsBtn) {
            fsBtn.addEventListener('click', () => {
                const el = document.documentElement;
                if (!document.fullscreenElement) {
                    if (el.requestFullscreen) { el.requestFullscreen(); }
                    else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
                    fsBtn.textContent = "解除";
                } else {
                    if (document.exitFullscreen) { document.exitFullscreen(); }
                    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
                    fsBtn.textContent = "全画面";
                }
            });
        }
        // --- 修正箇所：全画面状態の変化を監視してDB報告 ＋ ボタン文字も連動させる ---
        document.addEventListener('fullscreenchange', () => {
            const isFull = !!document.fullscreenElement;
            // 1. DBに全画面状態を報告（既存のまま）
            update(ref(db, `game/users/${myId}`), { isFullscreen: isFull });
            
            // 2. ESCキー解除にも対応できるよう、ボタンの文字を現在の状態に強制同期
            const fsBtn = document.getElementById('fullscreen-btn');
            if (fsBtn) {
                fsBtn.textContent = isFull ? "解除" : "全画面";
            }
        });

        // Safari用
        document.addEventListener('webkitfullscreenchange', () => {
            const isFull = !!document.webkitFullscreenElement;
            // 1. DBに全画面状態を報告（既存のまま）
            update(ref(db, `game/users/${myId}`), { isFullscreen: isFull });
            
            // 2. ボタンの文字を同期
            const fsBtn = document.getElementById('fullscreen-btn');
            if (fsBtn) {
                fsBtn.textContent = isFull ? "解除" : "全画面";
            }
        });

        onValue(ref(db, 'game/settings'), (snap) => {
            const data = snap.val();
            if(!data) return;
            // 強制退出コマンドのチェック（主催者以外）
            if (!isAdmin && data.forceExit) {
                alert('主催者によって退出させられました。');
                window.location.href = 'index.html'; // 退出先のURL
                return;
            }
            // 閉鎖モードのチェック（参加中に閉鎖された場合）
            const joinBtn = document.getElementById('btn-join-player');
            const closeMsg = document.getElementById('closed-message');
            if (joinBtn) {
                if (data.isClosed) {
                    joinBtn.style.setProperty('display', 'none', 'important');
                    if (closeMsg) closeMsg.innerText = "【現在、このルームは閉鎖されています】";
                } else {
                    joinBtn.style.setProperty('display', 'block', 'important');
                    if (closeMsg) closeMsg.innerText = "";
                }
            }
            // quizInfo = data; // ← ここにあったこの行を消して、下の「判定の後」へ移動させます。
            
            // --- リセット判定を先に行います ---
            if (data.round !== quizInfo.round || data.videoId !== lastVideoId) {
                hasPointedTitle = false;
                hasPointedArtist = false;
                roundPointsEarned = 0;
                window.is1stPointAwarded = false; 
            }

            quizInfo = data; // ここで新しいデータに更新します
            window.is1stPointAwarded = false; // 全体の1位フラグもリセット

            // ★追加：2倍ラウンド中の常時表示（枠の光り・バッジ）を切り替える
            const videoSectionEl = document.getElementById('video-section');
            const doubleRoundBadge = document.getElementById('double-round-badge');
            const isDoubleRound = Number(quizInfo.pointMultiplier) > 1;
            if (videoSectionEl) videoSectionEl.classList.toggle('double-round-active', isDoubleRound);
            if (doubleRoundBadge) doubleRoundBadge.style.display = isDoubleRound ? 'block' : 'none';

            // --- 選択肢モードのUI制御ここから追加 ---
            const choiceArea = document.getElementById('choice-container');
            const answerInput = document.getElementById('answer-input');
            const sendBtn = document.getElementById('btn-send-answer');

            if (quizInfo.isChoiceMode) {
                // 選択肢モード中の表示
                if (choiceArea) choiceArea.style.display = 'none';
                if (answerInput) {
                    answerInput.disabled = true; 
                    answerInput.placeholder = "選択肢から選んでください";
                }
                if (sendBtn) sendBtn.disabled = true;

                // ボタンに選択肢テキストをセットし、状態をリセット
                const btns = document.querySelectorAll('.choice-btn');
                if (quizInfo.choices && quizInfo.choices.length > 0) {
                    quizInfo.choices.forEach((text, i) => {
                        if (btns[i]) {
                            btns[i].innerText = text;
                            btns[i].disabled = false; // 回答権を復活（新ラウンドのため）
                            btns[i].style.background = "rgba(0, 0, 0, 0.8)"; // 背景を初期化
                            btns[i].style.borderColor = "var(--primary-color)"; // 枠線を初期化
                        }
                    });
                }

                // --- ここを追加：カウントダウン終了（READY?が消える）を待って表示 ---
                // 3000ms（3秒）など、あなたのカウントダウン秒数に合わせて数値を調整してください
                setTimeout(() => {
                    if (quizInfo.isChoiceMode && choiceArea) {
                        choiceArea.style.display = 'flex';
                    }
                }, 5500); 

            } else {
                // 通常モード（イントロ・クイズ・モザイク）
                if (choiceArea) choiceArea.style.display = 'none';
                if (answerInput) {
                    answerInput.disabled = false;
                    answerInput.placeholder = "答えを入力...";
                }
                if (sendBtn) sendBtn.disabled = false;

    // ★追加：通常モードの時も、新しい曲が始まったらパスボタンを復活させる
    const passBtn = document.getElementById('btn-pass') || document.getElementById('pass-btn');
    if (passBtn) {
        passBtn.disabled = false; // ボタンを復活させる
        passBtn.style.opacity = "1.0"; // 薄暗さを元に戻す
    }
}
            // --- 選択肢モードのUI制御ここまで ---
            
            const slider = document.getElementById('volume-slider');
            updateVolumeUI(slider.value);

            if(data.videoId && data.videoId !== lastVideoId) {
                lastVideoId = data.videoId;
                if (player && player.cueVideoById) {
                    player.cueVideoById({ 
                        videoId: data.videoId, 
                        startSeconds: data.startTimeOffset || 0 
                    });
                    // ★追加：新しい動画が読み込まれるたびに字幕を無効化
                    try { player.unloadModule('captions'); } catch (e) {}
                    // ★追加：初回再生と2回目以降で体感時間がズレる問題への対策。
                    // 裏でミュートしたまま一瞬だけ再生してデコーダーを温めてから、0秒地点に巻き戻しておく。
                    // video-coverで画面が隠れている間に行うため、参加者には一切気づかれない。
                    setTimeout(() => {
                        try {
                            if (player && player.mute && player.playVideo) {
                                player.mute();
                                player.playVideo();
                                setTimeout(() => {
                                    try {
                                        player.pauseVideo();
                                        player.seekTo(data.startTimeOffset || 0, true);
                                    } catch (e) {}
                                }, 400);
                            }
                        } catch (e) {
                            console.error('ウォームアップ再生エラー:', e);
                        }
                    }, 300); // cueVideoById直後はまだ準備が整っていないことがあるため少し待つ
                }
                document.getElementById('error-message').style.display = "none";
                window.isCurrentVideoError = false;
                document.getElementById('video-cover').style.display = "flex";
                document.getElementById('ready-text').style.display = "block";
                document.getElementById('countdown-container').style.display = "none";
                document.getElementById('play-sec-preview').style.display = "none";
                document.getElementById('quiz-question-display').style.display = "none";
                document.getElementById('quiz-timer-display').style.display = "none";
                document.getElementById('quiz-start-overlay').style.display = "none";
                
                const mosaic = document.getElementById('mosaic-overlay');
                const mask = document.getElementById('quiz-title-mask');
                
                if (quizInfo.isMosaicMode) {
                    mosaic.style.display = "none"; 
                    mask.style.display = "none";
                } else if (quizInfo.isQuizMode) {
                    mosaic.style.display = "none";
                    mask.style.display = "block";
                } else {
                    mosaic.style.display = "none";
                    mask.style.display = "none";
                }
                
                if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);

                // 動画IDではなく、Round番号の更新をトリガーにします
                if (data.round !== quizInfo.round || data.videoId !== lastVideoId) {
                    hasPointedTitle = false;
                    hasPointedArtist = false;
                    roundPointsEarned = 0;
                    window.is1stPointAwarded = false; 
                }
                
                isRevealedGlobal = false;
                isFirstPlayOfRound = true;
                document.getElementById('result-notice').style.display = "none";
                document.getElementById('fastest-ranking').style.display = "none";
                currentRankingVisible = false;
                window.is1stPointAwarded = false; 

                if (quizInfo.isQuizMode) {
                    document.getElementById('quiz-question-display').innerText = quizInfo.questionText;
                    document.getElementById('quiz-question-display').style.display = "block";
                }
            }
            document.getElementById('round-text').innerText = `ROUND ${quizInfo.round || 0}`;
            if(isAdmin) {
                document.getElementById('admin-round-text').innerText = `Round: ${quizInfo.round || 0}`;
                if (quizInfo.isQuizMode) {
                    document.getElementById('admin-answer-preview').innerText = `クイズ答え: ${quizInfo.title}`;
                } else {
                    document.getElementById('admin-answer-preview').innerText = `答え: ${quizInfo.title} / ${quizInfo.artist}`;
                }
            }
        });

        onValue(ref(db, 'game/signal'), (snap) => {
            const sig = snap.val(); 
            if(!sig || !player) return;

            if(sig.type === 'countdown') {
                const container = document.getElementById('countdown-container');
                const countDisp = document.getElementById('countdown-display');
                const line = document.getElementById('countdown-line');
                const readyText = document.getElementById('ready-text');
                const previewText = document.getElementById('play-sec-preview');

                readyText.style.display = "none";
                container.style.display = "flex";
                previewText.style.display = "block";
                previewText.innerText = `再生時間: ${sig.duration || 0}秒`;
                
                countDisp.innerText = sig.value;
                line.style.animation = 'none';
                line.offsetHeight; 
                line.style.animation = 'spin 1s linear forwards';

            } else if(sig.type === 'quiz_countdown') {
                const overlay = document.getElementById('quiz-start-overlay');
                overlay.style.display = "flex";
                overlay.innerText = sig.value;
                
                document.getElementById('ready-text').style.display = "none";
                document.getElementById('video-cover').style.display = "flex";
                
                const mask = document.getElementById('quiz-title-mask');
                
                if (quizInfo.isQuizMode && !quizInfo.isMosaicMode) {
                    mask.style.display = "block";
                }

            } else if(sig.type === 'play') {
                document.getElementById('countdown-container').style.display = "none";
                document.getElementById('play-sec-preview').style.display = "none";
                document.getElementById('quiz-start-overlay').style.display = "none";

                if (window.quizTimer) clearTimeout(window.quizTimer);
                if (window.quizCountdownInterval) clearInterval(window.quizCountdownInterval);
                if (window.titleMaskTimer) clearTimeout(window.titleMaskTimer);

                player.unMute();
                player.playVideo(); 
                player.seekTo(quizInfo.startTimeOffset || 0, true); 
                const correction = 100; 
                const duration = Math.max(0, (sig.value * 1000) - correction);
                window.quizTimer = setTimeout(() => { 
                    player.pauseVideo(); 
                    document.getElementById('quiz-timer-display').style.display = "none";
                    document.getElementById('mosaic-overlay').style.display = "none";
                    if (window.quizCountdownInterval) clearInterval(window.quizCountdownInterval);
                }, duration);
                isFirstPlayOfRound = false;

                if (quizInfo.isQuizMode) {
                    document.getElementById('video-cover').style.display = "none";
                    document.getElementById('player').style.opacity = "1";
                    document.getElementById('quiz-question-display').style.display = "block";
                    
                    const mask = document.getElementById('quiz-title-mask');
                    const mosaic = document.getElementById('mosaic-overlay');
                    
                    if (quizInfo.isMosaicMode) {
                        mask.style.display = "none";
                        mosaic.style.display = "block";
                        mosaic.style.backdropFilter = "blur(50px)";
                    } else {
                        mosaic.style.display = "none";
                        mask.style.display = "block";
                        window.titleMaskTimer = setTimeout(() => {
                            mask.style.display = "none";
                        }, 10000);
                    }

                    const timerDisp = document.getElementById('quiz-timer-display');
                    timerDisp.style.display = "block";
                    let timeLeft = 15;
                    timerDisp.innerText = timeLeft;
                    window.quizCountdownInterval = setInterval(() => {
                        timeLeft--;
                        if(timeLeft >= 0) {
                            timerDisp.innerText = timeLeft;
                            if (quizInfo.isMosaicMode) {
                                const blurVal = (timeLeft / 15) * 50;
                                mosaic.style.backdropFilter = `blur(${blurVal}px)`;
                            }
                        }
                        if(timeLeft <= 0) clearInterval(window.quizCountdownInterval);
                    }, 1000);

        onValue(ref(db, 'game/settings/bannedUsers'), (snap) => {

                // ★修正：アーティスト正解マークの行を新設（「正解」マークの右隣に並びます。色などを変えたい場合はクラス名でCSS調整可能です）
                const artistCorrectMark = ((isAdmin || isRevealedGlobal) && u.hasCorrectedArtist) ? '<span class="artist-correct-mark" style="color: #ffca28; font-size: 10px; margin-left: 5px; font-weight: bold; border: 1px solid #ffca28; padding: 1px 3px; border-radius: 3px;">アーティスト正解</span>' : '';

                // 全画面判定（ここから下は既存のコードのままです）
                const fullStatus = u.isFullscreen

                // 3. パスと離席の組み立て
                let statusParts = [];
                if (!isOnline) statusParts.push("<small style='color:#888;'>(離席)</small>");
                // 管理者または自分自身ならパス状態を表示
                if ((isAdmin || u.id === myId) && u.isPass) {
                    statusParts.push("<span style='color:#ff8c00; font-weight:bold; margin-left:5px;'>[パス]</span>");

                const statusText = statusParts.length > 0 ? " " + statusParts.join(" ") : "";

                // 4. ボタンとスコア表示
                const banBtn = (isAdmin && !u.isAdmin) ? `<button onclick="banUser('${u.id}')" style="font-size:10px; margin-left:5px; padding:2px 4px; border-radius:4px; border:none; background:#ff4d4d; color:white; cursor:pointer;">BAN</button>` : '';
                // ★修正：ブラインドモード中はスコアの代わりに🙈を表示（主催者・参加者どちらも）
                const scoreDisplay = u.isAdmin ? "" : (blindModeActive ? `<span style="color:#888; font-size:12px;">🙈</span>` : `<b>${displayScore} pt</b>`);

                // ★修正2：確実にデータを反映させるため、Firebaseのデータベース（ref(db, 'game/chats')）の最新情報、またはローカルに保持されている正しいデータソースから名前が一致する正解・回答履歴を1件ずつ正確に照合・集計する処理を挟みます。
                // 主催者側かつクリック時にその場で最新データを集計してアラート表示する関数を要素に直接仕込みます
                if (isAdmin) {
                    div.style.cursor = "pointer"; // クリックできることを分かりやすく
                    div.onclick = async (e) => {
                        // 誤動作防止（BANボタンなどのクリック時は発動しない）
                        if (e.target.tagName === 'BUTTON') return;

                        // 各データの集計用変数
                        let roundDetails = {}; // ラウンドごとの集計（獲得pt、早解き順位）
                        let total1stCount = 0; // 通算1位の回数
                        let total2ndCount = 0; // 通算2位の回数
                        let total3ndCount = 0; // 通算3位の回数
                        
                        // 照合用：現在のユーザーIDおよび名前の抽出
                        const currentUserId = (typeof uid !== 'undefined' ? uid : (typeof key !== 'undefined' ? key : (u.id || "")));
                        const cleanTargetName = u.name ? String(u.name).split('#')[0].trim().toLowerCase() : "";

                        try {
                            // 【修正】クリックされた瞬間に初めて非同期でデータを安全に取得
                            const cSnap = await get(ref(db, 'game/chats'));
                            const hSnap = await get(ref(db, 'game/history'));
                            
                            const currentRoundNum = Number(quizInfo?.round || 0);

                            // --- 過去のラウンドのポイント確定処理 ---
                            if (hSnap.exists()) {
                                hSnap.forEach(roundSnap => {
                                    const rNum = Number(roundSnap.key);
                                    const roundData = roundSnap.val();
                                    if (!roundData) return;
                                    const userHistory = roundData[currentUserId];
                                    
                                    if (userHistory && rNum !== currentRoundNum) {
                                        if (!roundDetails[rNum]) {
                                            roundDetails[rNum] = { pts: "0pt", rank: "圏外" };
                                        }
                                        // 保存されたそのままのデータをストレートに反映
                                        roundDetails[rNum].pts = userHistory.ptsDisplay || "0pt";
                                        
                                        // 順位も保存されたデータから復元
                                        const rVal = userHistory.rank;
                                        if (typeof rVal === 'number') {
                                            roundDetails[rNum].rank = `${rVal}位`;
                                            if (rVal === 1) total1stCount++;
                                            else if (rVal === 2) total2ndCount++;
                                            else if (rVal === 3) total3ndCount++;
                                        } else {
                                            roundDetails[rNum].rank = rVal || "正解";
                                        }
                                    }

                            // --- 現在進行中の最新ラウンド：historyから直接取得（過去ラウンドと同じ処理）---
                          if (currentRoundNum > 0) {

                              if (currentHistorySnap.exists()) {

                                  if (!roundDetails[currentRoundNum]) {

                                  roundDetails[currentRoundNum].pts = histEntry.ptsDisplay || "0pt";
                                  const rVal = histEntry.rank;
                                  if (rVal === 1) { roundDetails[currentRoundNum].rank = "1位"; total1stCount++; }

                                  else if (rVal === 3) { roundDetails[currentRoundNum].rank = "3位"; total3ndCount++; }

                                  else { roundDetails[currentRoundNum].rank = "判定中"; }

                            <span style="font-size: 18px; color: #fff; padding-left: 10px; display: inline-block; margin-top: 5px;">👑 1位: <b>${total1stCount}</b>回 / 🥈 2位: <b>${total2ndCount}</b>回 / 🥉 3位: <b>${total3ndCount}</b>回</span><br><br>

                        modalContainer.innerHTML = `

                                <button id="close-history-modal" style="position: absolute; top: 12px; right: 15px; background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; padding: 0; line-height: 1;">&times;</button>

                // 5. HTMLを一気に組み立て（title属性を廃止し、クリック可能な構成にします）

        onValue(query(ref(db, 'game/chats'), limitToLast(1)), (snap) => {

    function normalize(t) { return t ? t.normalize("NFKC").replace(/[！!？?。．、，\s]/g, "").replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)).toLowerCase() : ""; }
    window.sendPassSignal = () => {

        if (passBtn) {

            passBtn.style.opacity = "0.5"; // ボタンを半透明にして「押せない状態」を視覚的に伝える
        }

        pushChat("（パス）", false, false, false, false);
        if (myId) {
            update(ref(db, `game/users/${myId}`), { isPass: true })
                .then(() => {
                    showNotice("パスしました", "#888");
                });
        }
    };
    // --- 1. 得点計算とチャット送信の共通ロジック (これを独立させる) ---
    const processScore = (text, isTitle, isArtist, isExtra = false) => {
        // ★追加ガード：入室から2秒以内は、過去のデータの「残響」による誤動作を防ぐ
        if (typeof pageJoinTime !== 'undefined' && Date.now() - pageJoinTime < 2000) {
            return;
        }

        // ★既存の修正：すでにこの問題でタイトル正解済みの場合は...（以下そのまま）
        if (isTitle && hasPointedTitle) {
            return;
        }

        if(isAdmin || isRevealedGlobal) { 
            pushChat(text, false, false); 
            return; 
        }

        const now = Date.now();
        const startTime = quizInfo.startTime || 0;
        
        // カウントダウン中などの判定
        if (startTime === 0 || isRevealedGlobal) {
            pushChat(text, isTitle, isArtist);
            return;
        }

        const sec = quizInfo.currentSeconds || 0;
        let titlePoints = 0; let artistPoints = 0;

        // 得点計算
        if (quizInfo.isQuizMode) {
            const elapsed = (now - startTime) / 1000;
            if (elapsed > 15) titlePoints = 0; else titlePoints = Math.max(1, Math.ceil(15 - elapsed));
        } else {
            if (sec === 1 || sec === 1.5) { titlePoints = 10; artistPoints = 5; }
            else if (sec === 2 || sec === 2.5) { titlePoints = 9; artistPoints = 4; }
            else if (sec === 3) { titlePoints = 8; artistPoints = 3; }
            else if (sec === 5) { titlePoints = 6; artistPoints = 2; }
            else if (sec === 10) { titlePoints = 5; artistPoints = 1; }
        }

        // 正解時の処理
        if (isTitle && !hasPointedTitle) {

            let currentSeconds = 0;
            let isTimeUp = false; // ★タイムアップしているかどうかの目印

            if (quizInfo.isQuizMode) {

                // ★最終最強修正：タイマー要素が画面に存在しない、またはスタイルが非表示（displayが"none"）になっている場合は、

                if (!timerEl || timerEl.style.display === "none" || window.getComputedStyle(timerEl).display === "none") {
                    isTimeUp = true;
                } else {
                    const timerText = timerEl.innerText.trim();
                    if (!timerText || timerText === "" || timerText === "0") {

                    } else {
                        currentSeconds = parseInt(timerText, 10);

            }

                    // クイズモード ＝ 今回の秒数(addedPoints)

    // --- 2. キーボード入力用の送信処理 ---
    const sendAnswer = () => {
        const input = document.getElementById('answer-input'), text = input.value.trim();
        if(!text) return;

        const clean = (str) => {
            if (!str) return "";
            return str.toLowerCase()
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (s) => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/[ぁ-ん]/g, (s) => String.fromCharCode(s.charCodeAt(0) + 0x60))
                .replace(/ヴ/g, 'ブ')
                .replace(/[\s　・．。、，,.\-]/g, '');
        };

        const normIn = clean(text);
        const titleCandidates = quizInfo.title.split('.').map(c => clean(c));
        const artistCandidates = quizInfo.artist.split('.').map(c => clean(c));
        // ★修正：エクストラワードも曲名・アーティスト名と同じく「.」区切りで複数候補に対応
        const extraWordCandidates = (!quizInfo.isQuizMode && quizInfo.extraWord)
            ? quizInfo.extraWord.split('.').map(c => clean(c))
            : [];
        const isExtraWordMatch = extraWordCandidates.some(c => c !== "" && c === normIn);
        const isTitle = titleCandidates.some(c => c !== "" && c === normIn) || isExtraWordMatch;
        const isArtist = artistCandidates.some(c => c !== "" && c === normIn);

        // おしい判定
        if (!isTitle && !isArtist) {
            const getSim = (s1, s2) => {
                const l1 = s1.length, l2 = s2.length;
                if (l1 === 0 || l2 === 0) return 0;
                const d = Array.from({ length: l1 + 1 }, (_, i) => Array.from({ length: l2 + 1 }, (_, j) => i === 0 ? j : j === 0 ? i : 0));
                for (let i = 1; i <= l1; i++) {
                    for (let j = 1; j <= l2; j++) {
                        const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                    }
                }
                return 1 - d[l1][l2] / Math.max(l1, l2);
            };
            // ★修正：エクストラワードも「おしい」判定の対象に含める（複数候補すべてをチェック）
            const isNear = [...titleCandidates, ...artistCandidates, ...extraWordCandidates].some(c => c !== "" && getSim(c, normIn) >= 0.7);
            if (isNear) {
                showNotice("おしい！", "#ffa500");
                pushChat(text, false, false, true); 
                input.value = ""; return;
            }
        }

        processScore(text, isTitle, isArtist, isExtraWordMatch);
        input.value = "";
    };

    // ★追加：チャンスタイム（次のラウンド2倍ポイント）の演出本体。シグナル経由で全クライアントが同時再生する
    // ★追加：「ピチュン」効果音を合成して鳴らす（外部音声ファイル不要）
    let sfxAudioContext = null;
    function playPichunSound() {
        try {
            if (!sfxAudioContext) sfxAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = sfxAudioContext;
            if (ctx.state === 'suspended') ctx.resume();
            const now = ctx.currentTime;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.exponentialRampToValueAtTime(1900, now + 0.07);
            osc.frequency.exponentialRampToValueAtTime(950, now + 0.2);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.55, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.45);
        } catch (e) {
            console.error('効果音再生エラー:', e);
        }
    }
